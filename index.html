const STUDENT_PASSWORD = "Aphelion2026";

const HOUSES = ["伊希利尔","维尔卡帕","阿特莱亚","塔利亚","穆萨菲尔","克瑞乌萨"];

const WORLD_EPOCH_REAL = 2020;

const HEADERS = {

/* ==================== 工具 ==================== */
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

async function api(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { ...HEADERS, ...(opts.headers || {}) }
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error(typeof data === "object" ? JSON.stringify(data) : data);
  return data;
}

function showLoading(text = "正 在 连 接 魔 法 网 络") {
  document.getElementById("loadingText").textContent = text;
  document.getElementById("loadingOverlay").classList.add("show");
}
function hideLoading() {
  document.getElementById("loadingOverlay").classList.remove("show");
}
function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}
function closeModal() {
  document.getElementById("modal").classList.remove("show");
}
function toggleEye(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === "password") { inp.type = "text"; btn.classList.add("on"); }
  else { inp.type = "password"; btn.classList.remove("on"); }
}

/* ==================== 世界历 ==================== */
function getWorldDate() {
  const now = new Date();
  const year = WORLD_EPOCH_WORLD + (now.getFullYear() - WORLD_EPOCH_REAL);
  const month = now.getMonth() + 1;
  const day = now.getDate();
  let season;
  if (month >= 9 && month <= 11) season = "植收季";
  else if (month === 12 || month <= 2) season = "冰雪季";
  else if (month >= 3 && month <= 5) season = "萌芽季";
  else season = "谷收季";
  return { year, month, day, season };
}
function getCurrentWorldYear() { return getWorldDate().year; }
function renderWorldTime() {
  const w = getWorldDate();
  const el = document.getElementById("worldTime");
  if (!el) return;
  el.innerHTML = `世界历 <span class="season">${w.year}</span> <span class="sep">·</span> ${w.month} <span class="sep">·</span> ${w.day} <span class="sep">·</span> <span class="season">${w.season}</span>`;
  setTimeout(renderWorldTime, 60000);
}
function calcGrade(enrollYear) {
  if (!enrollYear) return null;
  const g = getCurrentWorldYear() - enrollYear + 1;
  if (g < 1) return 1;
  if (g > 7) return 7;
  return g;
}
function gradeText(enrollYear) {
  const g = calcGrade(enrollYear);
  return g ? `${g} 年级` : "";
}

/* ==================== 登录 ==================== */
async function doLogin() {
  const name = document.getElementById("loginName").value.trim();
  const pass = document.getElementById("loginPass").value;
  const house = document.getElementById("loginHouse").value;

  if (!name) { alert("请告诉我你的名谓。"); return; }
  if (!house) { alert("请选择你的学院。"); return; }
  if (pass !== STUDENT_PASSWORD) { alert("通行密码不正确。"); return; }

  showLoading("正 在 唤 醒 魔 法 阵");

  try {
    const existing = await api(`students?name=eq.${encodeURIComponent(name)}&select=*`);
    if (existing && existing.length) {
      const stu = existing[0];
      const patch = {};
      if (stu.house !== house) patch.house = house;
      if (!stu.enroll_year) patch.enroll_year = getCurrentWorldYear();
      if (!stu.role) patch.role = "student";
      if (Object.keys(patch).length) {
        await api(`students?name=eq.${encodeURIComponent(name)}`, {
          method: "PATCH",
          body: JSON.stringify(patch)
        });
      }
      session = { role: "student", name, house, enrollYear: stu.enroll_year || getCurrentWorldYear() };
    } else {
      const enrollYear = getCurrentWorldYear();
      await api(`students`, {
        method: "POST",
        body: JSON.stringify({ name, house, role: "student", enroll_year: enrollYear })
      });
      session = { role: "student", name, house, enrollYear };
    }
  } catch (e) {
    console.warn("学生记录失败:", e);
    session = { role: "student", name, house, enrollYear: getCurrentWorldYear() };
  }

  setTimeout(() => { hideLoading(); enterSystem(); }, 1600);
}

function flipToTeacher() {
  const login = document.getElementById("loginScreen");
  const teacher = document.getElementById("teacherScreen");
  const entry = document.getElementById("teacherEntry");
  if (entry) entry.style.display = "none";
  login.classList.add("screen-flip-out");
  setTimeout(() => {
    login.style.display = "none";
    login.classList.remove("screen-flip-out");
    teacher.style.display = "flex";
    teacher.classList.add("screen-flip-in");
    setTimeout(() => teacher.classList.remove("screen-flip-in"), 700);
  }, 700);
}

function backToStudent() {
  const login = document.getElementById("loginScreen");
  const teacher = document.getElementById("teacherScreen");
  const entry = document.getElementById("teacherEntry");
  teacher.classList.add("screen-flip-out");
  setTimeout(() => {
    teacher.style.display = "none";
    teacher.classList.remove("screen-flip-out");
    login.style.display = "flex";
    login.classList.add("screen-flip-in");
    setTimeout(() => {
      login.classList.remove("screen-flip-in");
      if (entry) entry.style.display = "flex";
    }, 700);
  }, 700);
}

async function doTeacherLogin() {
  const name = document.getElementById("teacherName").value.trim();
  const position = document.getElementById("teacherPosition").value;
  const pass = document.getElementById("teacherPass").value;

  if (!name) { alert("请输入你的名字。"); return; }
  if (!position) { alert("请选择你的职位。"); return; }

  let role = null;
  if (pass === SUPER_PASSWORD) role = "super";
  else if (pass === TEACHER_PASSWORD) role = "teacher";
  else { alert("密码不正确。"); return; }

  showLoading("正 在 验 证 教 师 权 限");

  try {
    const existing = await api(`students?name=eq.${encodeURIComponent(name)}&select=*`);
    if (existing && existing.length) {
      await api(`students?name=eq.${encodeURIComponent(name)}`, {
        method: "PATCH",
        body: JSON.stringify({ role, position })
      });
    } else {
      await api(`students`, {
        method: "POST",
        body: JSON.stringify({ name, role, position, house: null })
      });
    }
  } catch (e) { console.warn("教师记录失败:", e); }

  session = { role, name, position, house: null };

  setTimeout(() => {
    hideLoading();
    document.getElementById("teacherScreen").style.display = "none";
    enterSystem();
  }, 1400);
}

function doLogout() {
  session = { role: null, name: null, house: null, position: null, enrollYear: null };
  ["loginName","loginPass","loginHouse","teacherName","teacherPass","teacherPosition"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("mainScreen").style.display = "none";
  document.getElementById("teacherScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  const te = document.getElementById("teacherEntry");
  if (te) te.style.display = "flex";
}

function enterSystem() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("teacherScreen").style.display = "none";
  const te = document.getElementById("teacherEntry");
  if (te) te.style.display = "none";
  document.getElementById("mainScreen").style.display = "block";

  const topUser = document.getElementById("topUser");
  if (session.role === "student") {
    const grade = gradeText(session.enrollYear);
    topUser.innerHTML = `${esc(session.name)}<span class="user-house">${esc(session.house)}${grade ? " · " + grade : ""}</span>`;
  } else {
    const tag = session.role === "super" ? "SUPER" : "TEACHER";
    topUser.innerHTML = `${esc(session.name)}<span class="user-house">${esc(session.position || "")} · ${tag}</span>`;
  }

  renderWorldTime();
  if (session.role === "student") renderStudentTabs();
  else renderTeacherTabs();
}

/* ==================== 学生端 ==================== */
let studentTab = "quests";

function renderStudentTabs() {
  document.getElementById("tabBar").innerHTML = `
    <div class="tab ${studentTab==='quests'?'active':''}" onclick="switchStudentTab('quests')">课 题 板</div>
    <div class="tab ${studentTab==='mine'?'active':''}" onclick="switchStudentTab('mine')">我 的 课 题</div>
    <div class="tab ${studentTab==='items'?'active':''}" onclick="switchStudentTab('items')">我 的 物 品</div>
    <div class="tab ${studentTab==='forum'?'active':''}" onclick="switchStudentTab('forum')">讨 论 区</div>
    <div class="tab ${studentTab==='messages'?'active':''}" onclick="switchStudentTab('messages')">我 的 消 息</div>
  `;
  renderStudentContent();
}
function switchStudentTab(t) { studentTab = t; renderStudentTabs(); }

async function renderStudentContent() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    if (studentTab === "quests") await renderQuests();
    else if (studentTab === "mine") await renderMyQuests();
    else if (studentTab === "items") await renderMyItems();
    else if (studentTab === "forum") await renderForum();
    else if (studentTab === "messages") await renderMyMessages();
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function renderQuests() {
  const quests = await api(`quests?select=*&order=created_at.desc`);
  const box = document.getElementById("tabContents");
  if (!Array.isArray(quests) || !quests.length) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 课 题</div></div>`;
    return;
  }
  box.innerHTML = `<div class="panel">${quests.map(q => {
    const canClaim = q.status === "open";
    return `
      <div class="quest-card">
        <div class="quest-title">${esc(q.title)}</div>
        ${q.description ? `<div class="quest-desc">${esc(q.description)}</div>` : ""}
        ${q.location ? `<div class="quest-reward">📍 地点：${esc(q.location)}</div>` : ""}
        ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
        ${q.reward ? `<div class="quest-reward">✦ 奖励：${esc(q.reward)}</div>` : ""}
        ${q.max_claims ? `<div class="quest-reward">👥 推荐接取人数：${q.max_claims}</div>` : ""}
        <span class="status-badge ${statusClass(q.status)}">${statusText(q.status)}</span>
        ${canClaim ? `<button class="magic-btn small" style="margin-left:8px" onclick="claimQuest(${q.id})">领 取</button>` : ""}
      </div>
    `;
  }).join("")}</div>`;
}

function statusText(s) {
  return ({ open:"可领取", taken:"审核中", doing:"进行中", done:"已完成", rejected:"已驳回" })[s] || s;
}
function statusClass(s) {
  return ({ open:"s-open", taken:"s-pending", doing:"s-doing", done:"s-done", rejected:"s-rejected" })[s] || "s-open";
}

async function claimQuest(questId) {
  showLoading("正 在 提 交 申 请");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/claims`, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({
        quest_id: questId,
        student_name: session.name,
        house: session.house,
        status: "pending"
      })
    });
    if (!res.ok) {
      alert("这个课题已经被别人领取了。");
      hideLoading();
      renderStudentContent();
      return;
    }
    await api(`quests?id=eq.${questId}`, {
      method: "PATCH",
      body: JSON.stringify({ status: "taken" })
    });
    setTimeout(() => {
      hideLoading();
      alert("领取成功，等待教师审核。");
      renderStudentContent();
    }, 800);
  } catch (e) {
    hideLoading();
    alert("操作失败：" + e.message);
  }
}

async function renderMyQuests() {
  const claims = await api(`claims?student_name=eq.${encodeURIComponent(session.name)}&select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  if (!Array.isArray(claims) || !claims.length) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">你 还 没 有 领 取 任 何 课 题</div></div>`;
    return;
  }
  box.innerHTML = `<div class="panel">${claims.map(c => {
    const q = questMap[c.quest_id] || {};
    const itemsStatus = c.items_status || "none";
    let itemLine = "";
    if (c.items) {
      itemLine = `<div class="quest-desc">物品：${esc(c.items)} <span class="status-badge ${itemStatusClass(itemsStatus)}">${itemStatusText(itemsStatus)}</span></div>`;
    }
    const canSubmit = c.status === "approved" || c.status === "doing" || (c.status === "completed" && itemsStatus === "rejected");
    return `
      <div class="quest-card">
        <div class="quest-title">${esc(q.title || "（课题已删除）")}</div>
        ${q.location ? `<div class="quest-reward">📍 ${esc(q.location)}</div>` : ""}
        ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
        <span class="status-badge ${statusClass(c.status === "approved" ? "doing" : c.status)}">${statusText(c.status === "approved" ? "doing" : c.status)}</span>
        ${itemLine}
        ${canSubmit ? `<button class="magic-btn small" style="margin-top:10px" onclick="openSubmitItems(${c.id}, '${esc(q.title || "")}')">提 交 物 品</button>` : ""}
      </div>
    `;
  }).join("")}</div>`;
}

function itemStatusText(s) {
  return ({ none:"", pending:"待审核", approved:"已通过", rejected:"已驳回" })[s] || "";
}
function itemStatusClass(s) {
  return ({ pending:"s-pending", approved:"s-open", rejected:"s-rejected" })[s] || "";
}

function openSubmitItems(claimId, questTitle) {
  openModal(`
    <div class="modal-title">提 交 物 品</div>
    <div style="font-size:12px;color:#7f9bc8;margin-bottom:14px;">课题：${esc(questTitle)}</div>
    <input type="text" id="itemName" class="magic-input" placeholder="物品名称">
    <input type="text" id="itemQty" class="magic-input" placeholder="数量（可选）">
    <input type="text" id="itemNote" class="magic-input" placeholder="备注（可选）">
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="submitItems(${claimId})">提 交</button>
    </div>
  `);
}

async function submitItems(claimId) {
  const name = document.getElementById("itemName").value.trim();
  const qty = document.getElementById("itemQty").value.trim();
  const note = document.getElementById("itemNote").value.trim();
  if (!name) { alert("请填写物品名称"); return; }
  const items = qty ? `${name} × ${qty}${note ? "（" + note + "）" : ""}` : `${name}${note ? "（" + note + "）" : ""}`;
  showLoading("正 在 提 交");
  try {
    await api(`claims?id=eq.${claimId}`, {
      method: "PATCH",
      body: JSON.stringify({ items, items_status: "pending" })
    });
    setTimeout(() => {
      hideLoading();
      closeModal();
      alert("已提交，等待教师审核。");
      renderStudentContent();
    }, 800);
  } catch (e) {
    hideLoading();
    alert("提交失败：" + e.message);
  }
}

async function renderMyItems() {
  const claims = await api(`claims?student_name=eq.${encodeURIComponent(session.name)}&items_status=eq.approved&select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  if (!Array.isArray(claims) || !claims.length) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 已 记 录 的 物 品</div></div>`;
    return;
  }
  box.innerHTML = `<div class="panel">${claims.map(c => `
    <div class="quest-card">
      <div class="quest-title">${esc(c.items)}</div>
      <div class="quest-desc">来源课题：${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
      <div class="quest-reward">获得时间：${new Date(c.created_at).toLocaleString("zh-CN")}</div>
    </div>
  `).join("")}</div>`;
}

/* ==================== 讨论区（学生） ==================== */
async function renderForum() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">发 布 帖 子</div>
      <input type="text" id="postTitle" class="magic-input" placeholder="标题">
      <textarea id="postContent" class="magic-input" placeholder="说点什么..." rows="3"></textarea>
      <button class="magic-btn" onclick="submitPost()">发 布</button>
    </div>
    <div id="postList"></div>
  `;
  await loadPosts();
}

async function loadPosts() {
  const listEl = document.getElementById("postList");
  if (!listEl) return;
  listEl.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    const allPosts = await api(`posts?select=*&order=created_at.desc`);
    const posts = (allPosts || []).filter(p =>
      p.status === "approved" || p.author === session.name
    );
    if (!posts.length) {
      listEl.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 帖 子</div></div>`;
      return;
    }
    const comments = await api(`post_comments?select=*&order=created_at.asc`);
    const commentMap = {};
    (comments || []).forEach(c => {
      if (!commentMap[c.post_id]) commentMap[c.post_id] = [];
      commentMap[c.post_id].push(c);
    });
    listEl.innerHTML = `<div class="panel">${posts.map(p => {
      const myComments = commentMap[p.id] || [];
      let statusLine = "";
      if (p.status === "pending") statusLine = `<div class="quest-reward" style="color:#f0d090;">⏳ 审核中</div>`;
      if (p.status === "rejected") statusLine = `<div class="quest-reward" style="color:#ffa0a0;">✕ 已被驳回</div>`;
      return `
        <div class="quest-card">
          <div class="quest-title">${esc(p.title || "（无标题）")}</div>
          <div class="quest-desc">${esc(p.content)}</div>
          <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")}</div>
          ${statusLine}
          <button class="magic-btn small" onclick="likePost(${p.id}, ${p.likes || 0})">♡ 点赞 ${p.likes || 0}</button>
          <button class="magic-btn small" style="margin-left:8px" onclick="toggleComments(${p.id})">评 论 (${myComments.length})</button>
          <div id="comments-${p.id}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(120,170,255,0.3);">
            ${myComments.map(c => `
              <div class="comment-item">
                <div class="meta">${esc(c.author)} · ${new Date(c.created_at).toLocaleString("zh-CN")}</div>
                <div class="text">${esc(c.content)}</div>
              </div>
            `).join("")}
            <div style="display:flex;gap:8px;margin-top:10px;">
              <input type="text" id="commentInput-${p.id}" class="magic-input" style="margin:0;flex:1;" placeholder="写评论...">
              <button class="magic-btn small" onclick="submitComment(${p.id})">发 送</button>
            </div>
          </div>
        </div>
      `;
    }).join("")}</div>`;
  } catch (e) {
    listEl.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

function toggleComments(postId) {
  const el = document.getElementById("comments-" + postId);
  if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}

async function submitPost() {
  const title = document.getElementById("postTitle").value.trim();
  const content = document.getElementById("postContent").value.trim();
  if (!content) { alert("说点什么吧"); return; }
  showLoading("正 在 发 布");
  try {
    await api(`posts`, {
      method: "POST",
      body: JSON.stringify({
        author: session.name,
        author_role: session.role,
        house: session.house || null,
        title: title || null,
        content,
        status: "pending"
      })
    });
    document.getElementById("postTitle").value = "";
    document.getElementById("postContent").value = "";
    setTimeout(() => { hideLoading(); loadPosts(); }, 700);
  } catch (e) {
    hideLoading();
    alert("发布失败：" + e.message);
  }
}

async function likePost(postId, currentLikes) {
  try {
    await api(`posts?id=eq.${postId}`, {
      method: "PATCH",
      body: JSON.stringify({ likes: (currentLikes || 0) + 1 })
    });
    loadPosts();
  } catch (e) { alert("点赞失败：" + e.message); }
}

async function submitComment(postId) {
  const input = document.getElementById("commentInput-" + postId);
  const content = input.value.trim();
  if (!content) return;
  try {
    await api(`post_comments`, {
      method: "POST",
      body: JSON.stringify({ post_id: postId, author: session.name, content })
    });
    input.value = "";
    loadPosts();
    setTimeout(() => {
      const el = document.getElementById("comments-" + postId);
      if (el) el.style.display = "block";
    }, 200);
  } catch (e) { alert("评论失败：" + e.message); }
}

/* ==================== 我的消息 ==================== */
async function renderMyMessages() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    const msgs = await api(`messages?to_user=eq.${encodeURIComponent(session.name)}&select=*&order=created_at.desc`);
    if (!Array.isArray(msgs) || !msgs.length) {

        <div class="quest-title" style="${m.is_read ? "" : "color:#f0d090;"}">${m.is_read ? "系统消息" : "✦ 新消息"}</div>
        <div class="quest-desc">${esc(m.content)}</div>
        <div class="quest-reward">${new Date(m.created_at).toLocaleString("zh-CN")}</div>

async function markRead(msgId) {
  await api(`messages?id=eq.${msgId}`, {
    method: "PATCH",
    body: JSON.stringify({ is_read: true })
  });
  renderMyMessages();
}

/* ==================== 教师端 ==================== */
let teacherTab = "quests";

function renderTeacherTabs() {
  document.getElementById("tabBar").innerHTML = `
    <div class="tab ${teacherTab==='quests'?'active':''}" onclick="switchTeacherTab('quests')">课 题 管 理</div>
    <div class="tab ${teacherTab==='review'?'active':''}" onclick="switchTeacherTab('review')">审 核 中 心</div>
    <div class="tab ${teacherTab==='students'?'active':''}" onclick="switchTeacherTab('students')">学 生 总 览</div>
    <div class="tab ${teacherTab==='forum'?'active':''}" onclick="switchTeacherTab('forum')">帖 子 管 理</div>
  `;
  renderTeacherContent();
}
function switchTeacherTab(t) { teacherTab = t; renderTeacherTabs(); }

async function renderTeacherContent() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    if (teacherTab === "quests") await renderTeacherQuests();
    else if (teacherTab === "review") await renderReview();
    else if (teacherTab === "students") await renderStudents();
    else if (teacherTab === "forum") await renderForumAdmin();
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function renderTeacherQuests() {
  const quests = await api(`quests?select=*&order=created_at.desc`);
  const box = document.getElementById("tabContents");
  const list = Array.isArray(quests) ? quests : [];

  const locationOptions = LOCATIONS.map(l => `<option value="${l}">${l}</option>`).join("");

  box.innerHTML = `
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">发 布 新 课 题</div>
      <input type="text" id="nqTitle" class="magic-input" placeholder="课题标题">
      <textarea id="nqDesc" class="magic-input" placeholder="课题描述（必填）" rows="5"></textarea>
      <div class="select-wrap">
        <select id="nqLocation" class="magic-select">
          <option value="">— 请选择任务地点 —</option>
          ${locationOptions}
        </select>
      </div>
      <textarea id="nqCompletion" class="magic-input" placeholder="完成条件（必填，比如：提交一份实验结果）" rows="3"></textarea>
      <input type="text" id="nqReward" class="magic-input" placeholder="奖励（可选）">
      <input type="number" id="nqMax" class="magic-input" placeholder="推荐接取人数（默认 1）" min="1" value="1">
      <button class="magic-btn" onclick="createQuest()">发 布</button>
    </div>
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">现 有 课 题</div>
      ${list.length ? list.map(q => `
        <div class="quest-card">
          <div class="quest-title">${esc(q.title)}</div>
          ${q.description ? `<div class="quest-desc">${esc(q.description)}</div>` : ""}
          ${q.location ? `<div class="quest-reward">📍 ${esc(q.location)}</div>` : ""}
          ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
          ${q.reward ? `<div class="quest-reward">✦ ${esc(q.reward)}</div>` : ""}
          ${q.max_claims ? `<div class="quest-reward">👥 推荐接取人数：${q.max_claims}</div>` : ""}
          <span class="status-badge ${statusClass(q.status)}">${statusText(q.status)}</span>
          <button class="magic-btn small danger" style="float:right" onclick="deleteQuest(${q.id})">删 除</button>
        </div>
      `).join("") : `<div class="empty-hint">暂 无 课 题</div>`}
    </div>
  `;
}

async function createQuest() {
  const title = document.getElementById("nqTitle").value.trim();
  const desc = document.getElementById("nqDesc").value.trim();
  const location = document.getElementById("nqLocation").value;
  const completion = document.getElementById("nqCompletion").value.trim();
  const reward = document.getElementById("nqReward").value.trim();
  const max = parseInt(document.getElementById("nqMax").value) || 1;

  if (!title) { alert("请填标题"); return; }
  if (!desc) { alert("课题描述是必填的"); return; }
  if (!location) { alert("请选择任务地点"); return; }
  if (!completion) { alert("完成条件是必填的"); return; }
  if (max < 1) { alert("推荐接取人数至少为 1"); return; }

  showLoading("正 在 发 布");
  try {
    await api(`quests`, {
      method: "POST",
      body: JSON.stringify({
        title,
        description: desc,
        location,
        completion,
        reward,
        max_claims: max,
        status: "open"
      })
    });
    setTimeout(() => { hideLoading(); renderTeacherContent(); }, 700);
  } catch (e) {
    hideLoading();
    alert("失败：" + e.message);
  }
}

async function deleteQuest(id) {
  if (!confirm("确定删除这个课题？")) return;
  await api(`quests?id=eq.${id}`, { method: "DELETE" });
  renderTeacherContent();
}

async function renderReview() {
  const claims = await api(`claims?select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  const list = Array.isArray(claims) ? claims : [];
  const pendingClaim = list.filter(c => c.status === "pending");
  const pendingItems = list.filter(c => c.items_status === "pending");

  box.innerHTML = `
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">课 题 领 取 审 核</div>
      ${pendingClaim.length ? pendingClaim.map(c => `
        <div class="quest-card">
          <div class="quest-title">${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
          <div class="quest-desc">领取人：${esc(c.student_name)} · ${esc(c.house || "")}</div>
          <button class="magic-btn small success" onclick="approveClaim(${c.id}, ${c.quest_id})">通 过</button>
          <button class="magic-btn small danger" style="margin-left:8px" onclick="rejectClaim(${c.id}, ${c.quest_id})">驳 回</button>
        </div>
      `).join("") : `<div class="empty-hint">暂 无 待 审 核 的 领 取</div>`}
    </div>
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">物 品 审 核</div>
      ${pendingItems.length ? pendingItems.map(c => `
        <div class="quest-card">
          <div class="quest-title">${esc(c.items)}</div>
          <div class="quest-desc">提交人：${esc(c.student_name)} · ${esc(c.house || "")}</div>
          <div class="quest-desc">来源课题：${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
          <button class="magic-btn small success" onclick="approveItems(${c.id})">通 过</button>
          <button class="magic-btn small danger" style="margin-left:8px" onclick="rejectItems(${c.id})">驳 回</button>
          ${session.role === "super" ? `<button class="magic-btn small" style="margin-left:8px" onclick="editItems(${c.id}, '${esc(c.items)}')">修 改</button>` : ""}
        </div>
      `).join("") : `<div class="empty-hint">暂 无 待 审 核 的 物 品</div>`}
    </div>
  `;
}

async function approveClaim(claimId, questId) {
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ status: "approved" }) });
  await api(`quests?id=eq.${questId}`, { method: "PATCH", body: JSON.stringify({ status: "doing" }) });
  renderTeacherContent();
}
async function rejectClaim(claimId, questId) {
  await api(`claims?id=eq.${claimId}`, { method: "DELETE" });
  await api(`quests?id=eq.${questId}`, { method: "PATCH", body: JSON.stringify({ status: "open" }) });
  renderTeacherContent();
}
async function approveItems(claimId) {
  await api(`claims?id=eq.${claimId}`, {
    method: "PATCH",
    body: JSON.stringify({ items_status: "approved", status: "completed" })
  });
  const c = await api(`claims?id=eq.${claimId}&select=*`);
  if (c && c.length) {
    await api(`quests?id=eq.${c[0].quest_id}`, { method: "PATCH", body: JSON.stringify({ status: "done" }) });
  }
  renderTeacherContent();
}
async function rejectItems(claimId) {
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ items_status: "rejected" }) });
  renderTeacherContent();
}
function editItems(claimId, current) {
  openModal(`
    <div class="modal-title">修 改 物 品 记 录</div>
    <input type="text" id="editItemsVal" class="magic-input" value="${esc(current)}">
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="saveEditItems(${claimId})">保 存</button>
    </div>
  `);
}
async function saveEditItems(claimId) {
  const v = document.getElementById("editItemsVal").value;
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ items: v }) });
  closeModal();
  renderTeacherContent();
}

async function renderStudents() {
  const students = await api(`students?select=*&order=created_at.asc`);
  const claims = await api(`claims?select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);

  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  const stuList = (Array.isArray(students) ? students : []).filter(s => s.role === "student" || !s.role);
  const claimList = Array.isArray(claims) ? claims : [];

  const byHouse = {};
  HOUSES.forEach(h => byHouse[h] = []);
  stuList.forEach(s => {
    if (!byHouse[s.house]) byHouse[s.house] = [];
    byHouse[s.house].push(s);
  });

  let html = "";
  for (const h of HOUSES) {
    const list = byHouse[h] || [];
    if (!list.length) continue;
    html += `
      <div class="house-group">
        <div class="house-group-title">
          <span>${h}</span>
          <small>${list.length} 人</small>
        </div>
        ${list.map(s => {
          const myClaims = claimList.filter(c => c.student_name === s.name);
          const grade = gradeText(s.enroll_year);
          return `
            <div class="student-row">
              <div class="name">${esc(s.name)}${grade ? `<span class="grade">${grade}</span>` : ""}</div>
              ${myClaims.length ? myClaims.map(c => {
                const q = questMap[c.quest_id] || {};
                const itemTxt = c.items ? ` · 物品：${esc(c.items)} <span class="status-badge ${itemStatusClass(c.items_status || "none")}">${itemStatusText(c.items_status || "none")}</span>` : "";
                return `<div class="quest-info">◆ ${esc(q.title || "（已删除）")} — ${statusText(c.status === "approved" ? "doing" : c.status)}${itemTxt}</div>`;
              }).join("") : `<div class="quest-info">暂无领取记录</div>`}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  if (!html) html = `<div class="empty-hint">暂 无 学 生 记 录</div>`;
  box.innerHTML = `<div class="panel">${html}</div>`;
}

/* ==================== 帖子管理（教师） ==================== */
async function renderForumAdmin() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    const posts = await api(`posts?select=*&order=created_at.desc`);
    if (!Array.isArray(posts) || !posts.length) {
      box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 帖 子</div></div>`;
      return;
    }
    const pending = posts.filter(p => p.status === "pending");
    const approved = posts.filter(p => p.status === "approved");

    let html = `
      <div class="panel">
        <div style="font-size:14px;letter-spacing:3px;color:#f0d090;margin-bottom:14px;">⏳ 待 审 核 帖 子（${pending.length}）</div>
        ${pending.length ? pending.map(p => `
          <div class="quest-card">
            <div class="quest-title">${esc(p.title || "（无标题）")}</div>
            <div class="quest-desc">${esc(p.content)}</div>
            <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")}</div>
            <button class="magic-btn small success" onclick="approvePost(${p.id})">通 过</button>
            <button class="magic-btn small danger" style="margin-left:8px" onclick="rejectPost(${p.id}, '${esc(p.author)}', '${esc(p.title || "")}')">驳 回 并 通 知</button>
          </div>
        `).join("") : `<div class="empty-hint">暂 无 待 审 核 帖 子</div>`}
      </div>
    `;

    html += `
      <div class="panel">
        <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">已 通 过 帖 子（${approved.length}）</div>
        ${approved.length ? approved.map(p => `
          <div class="quest-card">
            <div class="quest-title">${esc(p.title || "（无标题）")}</div>
            <div class="quest-desc">${esc(p.content)}</div>
            <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")} · ♡ ${p.likes || 0}</div>
            <button class="magic-btn small danger" onclick="rejectPost(${p.id}, '${esc(p.author)}', '${esc(p.title || "")}')">删 除 并 通 知</button>
          </div>
        `).join("") : `<div class="empty-hint">暂 无 已 通 过 帖 子</div>`}
      </div>
    `;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function approvePost(postId) {
  await api(`posts?id=eq.${postId}`, { method: "PATCH", body: JSON.stringify({ status: "approved" }) });
  renderForumAdmin();
}
async function rejectPost(postId, author, title) {
  if (!confirm(`确定删除「${author}」的帖子？会给 TA 发一条通知。`)) return;
  const reason = prompt("请填写违禁原因（会发给学生）：", "涉嫌违禁内容");
  if (reason === null) return;
  try {
    await api(`messages`, {
      method: "POST",
      body: JSON.stringify({
        to_user: author,
        from_user: session.name,
        type: "post_rejected",
        content: `你发布的帖子「${title || "（无标题）"}」已被删除。原因：${reason || "涉嫌违禁内容"}`
      })
    });
    await api(`post_comments?post_id=eq.${postId}`, { method: "DELETE" });
    await api(`posts?id=eq.${postId}`, { method: "DELETE" });
    alert("已删除，并已通知作者。");
    renderForumAdmin();
  } catch (e) {
    alert("操作失败：" + e.message);
  }
}

let session = { role: null, name: null, house: null, position: null, enrollYear: null };

/* ==================== 工具 ==================== */
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

async function api(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { ...HEADERS, ...(opts.headers || {}) }
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error(typeof data === "object" ? JSON.stringify(data) : data);
  return data;
}

function showLoading(text = "正 在 连 接 魔 法 网 络") {
  document.getElementById("loadingText").textContent = text;
  document.getElementById("loadingOverlay").classList.add("show");
}
function hideLoading() {
  document.getElementById("loadingOverlay").classList.remove("show");
}
function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}
function closeModal() {
  document.getElementById("modal").classList.remove("show");
}
function toggleEye(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === "password") { inp.type = "text"; btn.classList.add("on"); }
  else { inp.type = "password"; btn.classList.remove("on"); }
}

/* ==================== 世界历 ==================== */
function getWorldDate() {
  const now = new Date();
  const year = WORLD_EPOCH_WORLD + (now.getFullYear() - WORLD_EPOCH_REAL);
  const month = now.getMonth() + 1;
  const day = now.getDate();
  let season;
  if (month >= 9 && month <= 11) season = "植收季";
  else if (month === 12 || month <= 2) season = "冰雪季";
  else if (month >= 3 && month <= 5) season = "萌芽季";
  else season = "谷收季";
  return { year, month, day, season };
}
function getCurrentWorldYear() { return getWorldDate().year; }
function renderWorldTime() {
  const w = getWorldDate();
  const el = document.getElementById("worldTime");
  if (!el) return;
  el.innerHTML = `世界历 <span class="season">${w.year}</span> <span class="sep">·</span> ${w.month} <span class="sep">·</span> ${w.day} <span class="sep">·</span> <span class="season">${w.season}</span>`;
  setTimeout(renderWorldTime, 60000);
}
function calcGrade(enrollYear) {
  if (!enrollYear) return null;
  const g = getCurrentWorldYear() - enrollYear + 1;
  if (g < 1) return 1;
  if (g > 7) return 7;
  return g;
}
function gradeText(enrollYear) {
  const g = calcGrade(enrollYear);
  return g ? `${g} 年级` : "";
}

/* ==================== 登录 ==================== */
async function doLogin() {
  const name = document.getElementById("loginName").value.trim();
  const pass = document.getElementById("loginPass").value;
  const house = document.getElementById("loginHouse").value;

  if (!name) { alert("请告诉我你的名谓。"); return; }
  if (!house) { alert("请选择你的学院。"); return; }
  if (pass !== STUDENT_PASSWORD) { alert("通行密码不正确。"); return; }

  showLoading("正 在 唤 醒 魔 法 阵");

  try {
    const existing = await api(`students?name=eq.${encodeURIComponent(name)}&select=*`);
    if (existing && existing.length) {
      const stu = existing[0];
      const patch = {};
      if (stu.house !== house) patch.house = house;
      if (!stu.enroll_year) patch.enroll_year = getCurrentWorldYear();
      if (!stu.role) patch.role = "student";
      if (Object.keys(patch).length) {
        await api(`students?name=eq.${encodeURIComponent(name)}`, {
          method: "PATCH",
          body: JSON.stringify(patch)
        });
      }
      session = { role: "student", name, house, enrollYear: stu.enroll_year || getCurrentWorldYear() };
    } else {
      const enrollYear = getCurrentWorldYear();
      await api(`students`, {
        method: "POST",
        body: JSON.stringify({ name, house, role: "student", enroll_year: enrollYear })
      });
      session = { role: "student", name, house, enrollYear };
    }
  } catch (e) {
    console.warn("学生记录失败:", e);
    session = { role: "student", name, house, enrollYear: getCurrentWorldYear() };
  }

  setTimeout(() => { hideLoading(); enterSystem(); }, 1600);
}

function flipToTeacher() {
  const login = document.getElementById("loginScreen");
  const teacher = document.getElementById("teacherScreen");
  const entry = document.getElementById("teacherEntry");
  if (entry) entry.style.display = "none";
  login.classList.add("screen-flip-out");
  setTimeout(() => {
    login.style.display = "none";
    login.classList.remove("screen-flip-out");
    teacher.style.display = "flex";
    teacher.classList.add("screen-flip-in");
    setTimeout(() => teacher.classList.remove("screen-flip-in"), 700);
  }, 700);
}

function backToStudent() {
  const login = document.getElementById("loginScreen");
  const teacher = document.getElementById("teacherScreen");
  const entry = document.getElementById("teacherEntry");
  teacher.classList.add("screen-flip-out");
  setTimeout(() => {
    teacher.style.display = "none";
    teacher.classList.remove("screen-flip-out");
    login.style.display = "flex";
    login.classList.add("screen-flip-in");
    setTimeout(() => {
      login.classList.remove("screen-flip-in");
      if (entry) entry.style.display = "flex";
    }, 700);
  }, 700);
}

async function doTeacherLogin() {
  const name = document.getElementById("teacherName").value.trim();
  const position = document.getElementById("teacherPosition").value;
  const pass = document.getElementById("teacherPass").value;

  if (!name) { alert("请输入你的名字。"); return; }
  if (!position) { alert("请选择你的职位。"); return; }

  let role = null;
  if (pass === SUPER_PASSWORD) role = "super";
  else if (pass === TEACHER_PASSWORD) role = "teacher";
  else { alert("密码不正确。"); return; }

  showLoading("正 在 验 证 教 师 权 限");

  try {
    const existing = await api(`students?name=eq.${encodeURIComponent(name)}&select=*`);
    if (existing && existing.length) {
      await api(`students?name=eq.${encodeURIComponent(name)}`, {
        method: "PATCH",
        body: JSON.stringify({ role, position })
      });
    } else {
      await api(`students`, {
        method: "POST",
        body: JSON.stringify({ name, role, position, house: null })
      });
    }
  } catch (e) { console.warn("教师记录失败:", e); }

  session = { role, name, position, house: null };

  setTimeout(() => {
    hideLoading();
    document.getElementById("teacherScreen").style.display = "none";
    enterSystem();
  }, 1400);
}

function doLogout() {
  session = { role: null, name: null, house: null, position: null, enrollYear: null };
  ["loginName","loginPass","loginHouse","teacherName","teacherPass","teacherPosition"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("mainScreen").style.display = "none";
  document.getElementById("teacherScreen").style.display = "none";
  document.getElementById("loginScreen").style.display = "flex";
  const te = document.getElementById("teacherEntry");
  if (te) te.style.display = "flex";
}

function enterSystem() {
  document.getElementById("loginScreen").style.display = "none";
  document.getElementById("teacherScreen").style.display = "none";
  const te = document.getElementById("teacherEntry");
  if (te) te.style.display = "none";
  document.getElementById("mainScreen").style.display = "block";

  const topUser = document.getElementById("topUser");
  if (session.role === "student") {
    const grade = gradeText(session.enrollYear);
    topUser.innerHTML = `${esc(session.name)}<span class="user-house">${esc(session.house)}${grade ? " · " + grade : ""}</span>`;
  } else {
    const tag = session.role === "super" ? "SUPER" : "TEACHER";
    topUser.innerHTML = `${esc(session.name)}<span class="user-house">${esc(session.position || "")} · ${tag}</span>`;
  }

  renderWorldTime();
  if (session.role === "student") renderStudentTabs();
  else renderTeacherTabs();
}

/* ==================== 学生端 ==================== */
let studentTab = "quests";

function renderStudentTabs() {
  document.getElementById("tabBar").innerHTML = `
    <div class="tab ${studentTab==='quests'?'active':''}" onclick="switchStudentTab('quests')">课 题 板</div>
    <div class="tab ${studentTab==='mine'?'active':''}" onclick="switchStudentTab('mine')">我 的 课 题</div>
    <div class="tab ${studentTab==='items'?'active':''}" onclick="switchStudentTab('items')">我 的 物 品</div>
    <div class="tab ${studentTab==='forum'?'active':''}" onclick="switchStudentTab('forum')">讨 论 区</div>
    <div class="tab ${studentTab==='messages'?'active':''}" onclick="switchStudentTab('messages')">我 的 消 息</div>
  `;
  renderStudentContent();
}
function switchStudentTab(t) { studentTab = t; renderStudentTabs(); }

async function renderStudentContent() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    if (studentTab === "quests") await renderQuests();
    else if (studentTab === "mine") await renderMyQuests();
    else if (studentTab === "items") await renderMyItems();
    else if (studentTab === "forum") await renderForum();
    else if (studentTab === "messages") await renderMyMessages();
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function renderQuests() {
  const quests = await api(`quests?select=*&order=created_at.desc`);
  const box = document.getElementById("tabContents");
  if (!Array.isArray(quests) || !quests.length) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 课 题</div></div>`;
    return;
  }
  box.innerHTML = `<div class="panel">${quests.map(q => {
    const canClaim = q.status === "open";
    return `
      <div class="quest-card">
        <div class="quest-title">${esc(q.title)}</div>
        ${q.description ? `<div class="quest-desc">${esc(q.description)}</div>` : ""}
        ${q.location ? `<div class="quest-reward">📍 地点：${esc(q.location)}</div>` : ""}
        ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
        ${q.reward ? `<div class="quest-reward">✦ 奖励：${esc(q.reward)}</div>` : ""}
        ${q.max_claims ? `<div class="quest-reward">👥 推荐接取人数：${q.max_claims}</div>` : ""}
        <span class="status-badge ${statusClass(q.status)}">${statusText(q.status)}</span>
        ${canClaim ? `<button class="magic-btn small" style="margin-left:8px" onclick="claimQuest(${q.id})">领 取</button>` : ""}
      </div>
    `;
  }).join("")}</div>`;
}

function statusText(s) {
  return ({ open:"可领取", taken:"审核中", doing:"进行中", done:"已完成", rejected:"已驳回" })[s] || s;
}
function statusClass(s) {
  return ({ open:"s-open", taken:"s-pending", doing:"s-doing", done:"s-done", rejected:"s-rejected" })[s] || "s-open";
}

async function claimQuest(questId) {
  showLoading("正 在 提 交 申 请");
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/claims`, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({
        quest_id: questId,
        student_name: session.name,
        house: session.house,
        status: "pending"
      })
    });
    if (!res.ok) {
      alert("这个课题已经被别人领取了。");
      hideLoading();
      renderStudentContent();
      return;
    }
    await api(`quests?id=eq.${questId}`, {
      method: "PATCH",
      body: JSON.stringify({ status: "taken" })
    });
    setTimeout(() => {
      hideLoading();
      alert("领取成功，等待教师审核。");
      renderStudentContent();
    }, 800);
  } catch (e) {
    hideLoading();
    alert("操作失败：" + e.message);
  }
}

async function renderMyQuests() {
  const claims = await api(`claims?student_name=eq.${encodeURIComponent(session.name)}&select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  if (!Array.isArray(claims) || !claims.length) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">你 还 没 有 领 取 任 何 课 题</div></div>`;
    return;
  }
  box.innerHTML = `<div class="panel">${claims.map(c => {
    const q = questMap[c.quest_id] || {};
    const itemsStatus = c.items_status || "none";
    let itemLine = "";
    if (c.items) {
      itemLine = `<div class="quest-desc">物品：${esc(c.items)} <span class="status-badge ${itemStatusClass(itemsStatus)}">${itemStatusText(itemsStatus)}</span></div>`;
    }
    const canSubmit = c.status === "approved" || c.status === "doing" || (c.status === "completed" && itemsStatus === "rejected");
    return `
      <div class="quest-card">
        <div class="quest-title">${esc(q.title || "（课题已删除）")}</div>
        ${q.location ? `<div class="quest-reward">📍 ${esc(q.location)}</div>` : ""}
        ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
        <span class="status-badge ${statusClass(c.status === "approved" ? "doing" : c.status)}">${statusText(c.status === "approved" ? "doing" : c.status)}</span>
        ${itemLine}
        ${canSubmit ? `<button class="magic-btn small" style="margin-top:10px" onclick="openSubmitItems(${c.id}, '${esc(q.title || "")}')">提 交 物 品</button>` : ""}
      </div>
    `;
  }).join("")}</div>`;
}

function itemStatusText(s) {
  return ({ none:"", pending:"待审核", approved:"已通过", rejected:"已驳回" })[s] || "";
}
function itemStatusClass(s) {
  return ({ pending:"s-pending", approved:"s-open", rejected:"s-rejected" })[s] || "";
}

function openSubmitItems(claimId, questTitle) {
  openModal(`
    <div class="modal-title">提 交 物 品</div>
    <div style="font-size:12px;color:#7f9bc8;margin-bottom:14px;">课题：${esc(questTitle)}</div>
    <input type="text" id="itemName" class="magic-input" placeholder="物品名称">

    <input type="text" id="itemNote" class="magic-input" placeholder="备注（可选）">
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="submitItems(${claimId})">提 交</button>
    </div>
  `);
}

async function submitItems(claimId) {
  const name = document.getElementById("itemName").value.trim();
  const qty = document.getElementById("itemQty").value.trim();
  const note = document.getElementById("itemNote").value.trim();
  if (!name) { alert("请填写物品名称"); return; }
  const items = qty ? `${name} × ${qty}${note ? "（" + note + "）" : ""}` : `${name}${note ? "（" + note + "）" : ""}`;
  showLoading("正 在 提 交");
  try {
    await api(`claims?id=eq.${claimId}`, {
      method: "PATCH",
      body: JSON.stringify({ items, items_status: "pending" })
    });
    setTimeout(() => {
      hideLoading();
      closeModal();
      alert("已提交，等待教师审核。");
      renderStudentContent();
    }, 800);
  } catch (e) {
    hideLoading();
    alert("提交失败：" + e.message);
  }
}

async function renderForum() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">发 布 帖 子</div>

async function loadPosts() {
  const listEl = document.getElementById("postList");
  if (!listEl) return;
  listEl.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    const allPosts = await api(`posts?select=*&order=created_at.desc`);
    const posts = (allPosts || []).filter(p =>
      p.status === "approved" || p.author === session.name
    );
    if (!posts.length) {
      listEl.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 帖 子</div></div>`;
      return;
    }
    const comments = await api(`post_comments?select=*&order=created_at.asc`);
    const commentMap = {};
    (comments || []).forEach(c => {
      if (!commentMap[c.post_id]) commentMap[c.post_id] = [];
      commentMap[c.post_id].push(c);
    });
    listEl.innerHTML = `<div class="panel">${posts.map(p => {
      const myComments = commentMap[p.id] || [];
      let statusLine = "";
      if (p.status === "pending") statusLine = `<div class="quest-reward" style="color:#f0d090;">⏳ 审核中</div>`;
      if (p.status === "rejected") statusLine = `<div class="quest-reward" style="color:#ffa0a0;">✕ 已被驳回</div>`;
      return `
        <div class="quest-card">
          <div class="quest-title">${esc(p.title || "（无标题）")}</div>
          <div class="quest-desc">${esc(p.content)}</div>
          <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")}</div>
          ${statusLine}
          <button class="magic-btn small" onclick="likePost(${p.id}, ${p.likes || 0})">♡ 点赞 ${p.likes || 0}</button>
          <button class="magic-btn small" style="margin-left:8px" onclick="toggleComments(${p.id})">评 论 (${myComments.length})</button>
          <div id="comments-${p.id}" style="display:none;margin-top:14px;padding-top:14px;border-top:1px dashed rgba(120,170,255,0.3);">
            ${myComments.map(c => `
              <div class="comment-item">
                <div class="meta">${esc(c.author)} · ${new Date(c.created_at).toLocaleString("zh-CN")}</div>
                <div class="text">${esc(c.content)}</div>
              </div>
            `).join("")}
            <div style="display:flex;gap:8px;margin-top:10px;">
              <input type="text" id="commentInput-${p.id}" class="magic-input" style="margin:0;flex:1;" placeholder="写评论...">
              <button class="magic-btn small" onclick="submitComment(${p.id})">发 送</button>
            </div>
          </div>
        </div>
      `;
    }).join("")}</div>`;
  } catch (e) {
    listEl.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

function toggleComments(postId) {
  const el = document.getElementById("comments-" + postId);
  if (el) el.style.display = el.style.display === "none" ? "block" : "none";
}

async function submitPost() {
  const title = document.getElementById("postTitle").value.trim();
  const content = document.getElementById("postContent").value.trim();
  if (!content) { alert("说点什么吧"); return; }
  showLoading("正 在 发 布");
  try {
    await api(`posts`, {
      method: "POST",
      body: JSON.stringify({
        author: session.name,
        author_role: session.role,
        house: session.house || null,
        title: title || null,
        content,
        status: "pending"
      })
    });
    document.getElementById("postTitle").value = "";
    document.getElementById("postContent").value = "";
    setTimeout(() => { hideLoading(); loadPosts(); }, 700);
  } catch (e) {
    hideLoading();
    alert("发布失败：" + e.message);
  }
}

async function likePost(postId, currentLikes) {
  try {
    await api(`posts?id=eq.${postId}`, {
      method: "PATCH",
      body: JSON.stringify({ likes: (currentLikes || 0) + 1 })
    });
    loadPosts();
  } catch (e) { alert("点赞失败：" + e.message); }
}

async function submitComment(postId) {
  const input = document.getElementById("commentInput-" + postId);
  const content = input.value.trim();
  if (!content) return;
  try {
    await api(`post_comments`, {
      method: "POST",
      body: JSON.stringify({ post_id: postId, author: session.name, content })
    });
    input.value = "";
    loadPosts();
    setTimeout(() => {
      const el = document.getElementById("comments-" + postId);
      if (el) el.style.display = "block";
    }, 200);
  } catch (e) { alert("评论失败：" + e.message); }
}

        ${m.is_read ? "" : `<button class="magic-btn small" onclick="markRead(${m.id})">标 记 已 读</button>`}
      </div>
    `).join("")}</div>`;
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function markRead(msgId) {
  await api(`messages?id=eq.${msgId}`, {
    method: "PATCH",
    body: JSON.stringify({ is_read: true })
  });
  renderMyMessages();
}

/* ==================== 教师端 ==================== */
let teacherTab = "quests";

function renderTeacherTabs() {
  document.getElementById("tabBar").innerHTML = `
    <div class="tab ${teacherTab==='quests'?'active':''}" onclick="switchTeacherTab('quests')">课 题 管 理</div>
    <div class="tab ${teacherTab==='review'?'active':''}" onclick="switchTeacherTab('review')">审 核 中 心</div>
    <div class="tab ${teacherTab==='students'?'active':''}" onclick="switchTeacherTab('students')">学 生 总 览</div>
    <div class="tab ${teacherTab==='forum'?'active':''}" onclick="switchTeacherTab('forum')">帖 子 管 理</div>
  `;
  renderTeacherContent();
}
function switchTeacherTab(t) { teacherTab = t; renderTeacherTabs(); }

async function renderTeacherContent() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    if (teacherTab === "quests") await renderTeacherQuests();
    else if (teacherTab === "review") await renderReview();
    else if (teacherTab === "students") await renderStudents();
    else if (teacherTab === "forum") await renderForumAdmin();
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function renderTeacherQuests() {
  const quests = await api(`quests?select=*&order=created_at.desc`);
  const box = document.getElementById("tabContents");
  const list = Array.isArray(quests) ? quests : [];

  const locationOptions = LOCATIONS.map(l => `<option value="${l}">${l}</option>`).join("");

  box.innerHTML = `
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">发 布 新 课 题</div>
      <input type="text" id="nqTitle" class="magic-input" placeholder="课题标题">
      <textarea id="nqDesc" class="magic-input" placeholder="课题描述（必填）" rows="5"></textarea>
      <div class="select-wrap">
        <select id="nqLocation" class="magic-select">
          <option value="">— 请选择任务地点 —</option>
          ${locationOptions}
        </select>
      </div>
      <textarea id="nqCompletion" class="magic-input" placeholder="完成条件（必填，比如：提交一份实验结果）" rows="3"></textarea>
      <input type="text" id="nqReward" class="magic-input" placeholder="奖励（可选）">
      <input type="number" id="nqMax" class="magic-input" placeholder="推荐接取人数（默认 1）" min="1" value="1">
      <button class="magic-btn" onclick="createQuest()">发 布</button>
    </div>
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">现 有 课 题</div>
      ${list.length ? list.map(q => `
        <div class="quest-card">
          <div class="quest-title">${esc(q.title)}</div>
          ${q.description ? `<div class="quest-desc">${esc(q.description)}</div>` : ""}
          ${q.location ? `<div class="quest-reward">📍 ${esc(q.location)}</div>` : ""}
          ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
          ${q.reward ? `<div class="quest-reward">✦ ${esc(q.reward)}</div>` : ""}
          ${q.max_claims ? `<div class="quest-reward">👥 推荐接取人数：${q.max_claims}</div>` : ""}
          <span class="status-badge ${statusClass(q.status)}">${statusText(q.status)}</span>
          <button class="magic-btn small danger" style="float:right" onclick="deleteQuest(${q.id})">删 除</button>
        </div>
      `).join("") : `<div class="empty-hint">暂 无 课 题</div>`}
    </div>
  `;
}

async function createQuest() {
  const title = document.getElementById("nqTitle").value.trim();
  const desc = document.getElementById("nqDesc").value.trim();
  const location = document.getElementById("nqLocation").value;
  const completion = document.getElementById("nqCompletion").value.trim();
  const reward = document.getElementById("nqReward").value.trim();
  const max = parseInt(document.getElementById("nqMax").value) || 1;

  if (!title) { alert("请填标题"); return; }
  if (!desc) { alert("课题描述是必填的"); return; }
  if (!location) { alert("请选择任务地点"); return; }
  if (!completion) { alert("完成条件是必填的"); return; }
  if (max < 1) { alert("推荐接取人数至少为 1"); return; }

  showLoading("正 在 发 布");
  try {
    await api(`quests`, {
      method: "POST",
      body: JSON.stringify({
        title,
        description: desc,
        location,
        completion,
        reward,
        max_claims: max,
        status: "open"
      })
    });
    setTimeout(() => { hideLoading(); renderTeacherContent(); }, 700);
  } catch (e) {
    hideLoading();
    alert("失败：" + e.message);
  }
}

async function deleteQuest(id) {
  if (!confirm("确定删除这个课题？")) return;
  await api(`quests?id=eq.${id}`, { method: "DELETE" });
  renderTeacherContent();
}

async function renderReview() {
  const claims = await api(`claims?select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  const list = Array.isArray(claims) ? claims : [];
  const pendingClaim = list.filter(c => c.status === "pending");
  const pendingItems = list.filter(c => c.items_status === "pending");

  box.innerHTML = `
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">课 题 领 取 审 核</div>
      ${pendingClaim.length ? pendingClaim.map(c => `
        <div class="quest-card">
          <div class="quest-title">${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
          <div class="quest-desc">领取人：${esc(c.student_name)} · ${esc(c.house || "")}</div>
          <button class="magic-btn small success" onclick="approveClaim(${c.id}, ${c.quest_id})">通 过</button>
          <button class="magic-btn small danger" style="margin-left:8px" onclick="rejectClaim(${c.id}, ${c.quest_id})">驳 回</button>
        </div>
      `).join("") : `<div class="empty-hint">暂 无 待 审 核 的 领 取</div>`}
    </div>
    <div class="panel">
      <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">物 品 审 核</div>
      ${pendingItems.length ? pendingItems.map(c => `
        <div class="quest-card">
          <div class="quest-title">${esc(c.items)}</div>
          <div class="quest-desc">提交人：${esc(c.student_name)} · ${esc(c.house || "")}</div>
          <div class="quest-desc">来源课题：${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
          <button class="magic-btn small success" onclick="approveItems(${c.id})">通 过</button>
          <button class="magic-btn small danger" style="margin-left:8px" onclick="rejectItems(${c.id})">驳 回</button>
          ${session.role === "super" ? `<button class="magic-btn small" style="margin-left:8px" onclick="editItems(${c.id}, '${esc(c.items)}')">修 改</button>` : ""}
        </div>
      `).join("") : `<div class="empty-hint">暂 无 待 审 核 的 物 品</div>`}
    </div>
  `;
}

async function approveClaim(claimId, questId) {
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ status: "approved" }) });
  await api(`quests?id=eq.${questId}`, { method: "PATCH", body: JSON.stringify({ status: "doing" }) });
  renderTeacherContent();
}
async function rejectClaim(claimId, questId) {
  await api(`claims?id=eq.${claimId}`, { method: "DELETE" });
  await api(`quests?id=eq.${questId}`, { method: "PATCH", body: JSON.stringify({ status: "open" }) });
  renderTeacherContent();
}
async function approveItems(claimId) {
  await api(`claims?id=eq.${claimId}`, {
    method: "PATCH",
    body: JSON.stringify({ items_status: "approved", status: "completed" })
  });
  const c = await api(`claims?id=eq.${claimId}&select=*`);
  if (c && c.length) {
    await api(`quests?id=eq.${c[0].quest_id}`, { method: "PATCH", body: JSON.stringify({ status: "done" }) });
  }
  renderTeacherContent();
}
async function rejectItems(claimId) {
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ items_status: "rejected" }) });
  renderTeacherContent();
}
function editItems(claimId, current) {
  openModal(`
    <div class="modal-title">修 改 物 品 记 录</div>
    <input type="text" id="editItemsVal" class="magic-input" value="${esc(current)}">
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="saveEditItems(${claimId})">保 存</button>
    </div>
  `);
}
async function saveEditItems(claimId) {
  const v = document.getElementById("editItemsVal").value;
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ items: v }) });
  closeModal();
  renderTeacherContent();
}

async function renderStudents() {
  const students = await api(`students?select=*&order=created_at.asc`);
  const claims = await api(`claims?select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);

  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  const stuList = (Array.isArray(students) ? students : []).filter(s => s.role === "student" || !s.role);
  const claimList = Array.isArray(claims) ? claims : [];

  const byHouse = {};
  HOUSES.forEach(h => byHouse[h] = []);
  stuList.forEach(s => {
    if (!byHouse[s.house]) byHouse[s.house] = [];
    byHouse[s.house].push(s);
  });

  let html = "";
  for (const h of HOUSES) {
    const list = byHouse[h] || [];
    if (!list.length) continue;
    html += `
      <div class="house-group">
        <div class="house-group-title">
          <span>${h}</span>
          <small>${list.length} 人</small>
        </div>
        ${list.map(s => {
          const myClaims = claimList.filter(c => c.student_name === s.name);
          const grade = gradeText(s.enroll_year);
          return `
            <div class="student-row">
              <div class="name">${esc(s.name)}${grade ? `<span class="grade">${grade}</span>` : ""}</div>
              ${myClaims.length ? myClaims.map(c => {
                const q = questMap[c.quest_id] || {};
                const itemTxt = c.items ? ` · 物品：${esc(c.items)} <span class="status-badge ${itemStatusClass(c.items_status || "none")}">${itemStatusText(c.items_status || "none")}</span>` : "";
                return `<div class="quest-info">◆ ${esc(q.title || "（已删除）")} — ${statusText(c.status === "approved" ? "doing" : c.status)}${itemTxt}</div>`;
              }).join("") : `<div class="quest-info">暂无领取记录</div>`}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }

  if (!html) html = `<div class="empty-hint">暂 无 学 生 记 录</div>`;
  box.innerHTML = `<div class="panel">${html}</div>`;
}

/* ==================== 帖子管理（教师） ==================== */
async function renderForumAdmin() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    const posts = await api(`posts?select=*&order=created_at.desc`);
    if (!Array.isArray(posts) || !posts.length) {
      box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 帖 子</div></div>`;
      return;
    }
    const pending = posts.filter(p => p.status === "pending");
    const approved = posts.filter(p => p.status === "approved");

    let html = `
      <div class="panel">
        <div style="font-size:14px;letter-spacing:3px;color:#f0d090;margin-bottom:14px;">⏳ 待 审 核 帖 子（${pending.length}）</div>
        ${pending.length ? pending.map(p => `
          <div class="quest-card">
            <div class="quest-title">${esc(p.title || "（无标题）")}</div>
            <div class="quest-desc">${esc(p.content)}</div>
            <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")}</div>
            <button class="magic-btn small success" onclick="approvePost(${p.id})">通 过</button>
            <button class="magic-btn small danger" style="margin-left:8px" onclick="rejectPost(${p.id}, '${esc(p.author)}', '${esc(p.title || "")}')">驳 回 并 通 知</button>
          </div>
        `).join("") : `<div class="empty-hint">暂 无 待 审 核 帖 子</div>`}
      </div>
    `;

    html += `
      <div class="panel">
        <div style="font-size:14px;letter-spacing:3px;color:#bcd8ff;margin-bottom:14px;">已 通 过 帖 子（${approved.length}）</div>
        ${approved.length ? approved.map(p => `
          <div class="quest-card">
            <div class="quest-title">${esc(p.title || "（无标题）")}</div>
            <div class="quest-desc">${esc(p.content)}</div>
            <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")} · ♡ ${p.likes || 0}</div>
            <button class="magic-btn small danger" onclick="rejectPost(${p.id}, '${esc(p.author)}', '${esc(p.title || "")}')">删 除 并 通 知</button>
          </div>
        `).join("") : `<div class="empty-hint">暂 无 已 通 过 帖 子</div>`}
      </div>
    `;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function approvePost(postId) {
  await api(`posts?id=eq.${postId}`, { method: "PATCH", body: JSON.stringify({ status: "approved" }) });
  renderForumAdmin();
}
async function rejectPost(postId, author, title) {
  if (!confirm(`确定删除「${author}」的帖子？会给 TA 发一条通知。`)) return;
  const reason = prompt("请填写违禁原因（会发给学生）：", "涉嫌违禁内容");
  if (reason === null) return;
  try {
    await api(`messages`, {
      method: "POST",
      body: JSON.stringify({
        to_user: author,
        from_user: session.name,
        type: "post_rejected",
        content: `你发布的帖子「${title || "（无标题）"}」已被删除。原因：${reason || "涉嫌违禁内容"}`
      })
    });
    await api(`post_comments?post_id=eq.${postId}`, { method: "DELETE" });
    await api(`posts?id=eq.${postId}`, { method: "DELETE" });
    alert("已删除，并已通知作者。");
    renderForumAdmin();
  } catch (e) {
    alert("操作失败：" + e.message);
  }
}

/* ==================== 启动 ==================== */
window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") closeModal();
});
