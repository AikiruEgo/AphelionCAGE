<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阿斐理恩魔法学院 · 课题板</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&display=swap" rel="stylesheet">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }

  :root {
    --bg-deep: #0a0618;
    --bg-mid: #150a28;
    --gold: #e8c66a;
    --gold-dim: #b8933a;
    --purple: #6a4fd0;
    --purple-deep: #3a2a8a;
    --purple-dark: #2a1a6a;
    --text-main: #e8e0f0;
    --text-soft: #c0b0d8;
    --text-dim: #8878a8;
  }

  body {
    font-family: "Cinzel", "Cormorant Garamond", "Songti SC", "STSong", serif;
    color: var(--text-main);
    min-height: 100vh;
    background:
      radial-gradient(ellipse at 50% 0%, #2a1a4a 0%, transparent 60%),
      radial-gradient(ellipse at 50% 100%, #1a0e2e 0%, transparent 60%),
      linear-gradient(160deg, #0a0618 0%, #150a28 50%, #0a0618 100%);
    overflow-x: hidden;
    position: relative;
  }

  body::before {
    content: "";
    position: fixed; inset: 0; z-index: 0;
    pointer-events: none;
    background-image:
      radial-gradient(1px 1px at 10% 20%, #fff, transparent),
      radial-gradient(1px 1px at 80% 30%, #c8b8ff, transparent),
      radial-gradient(1.5px 1.5px at 35% 60%, #fff, transparent),
      radial-gradient(1px 1px at 60% 75%, #e0d0ff, transparent),
      radial-gradient(1.5px 1.5px at 90% 85%, #fff, transparent),
      radial-gradient(1px 1px at 25% 90%, #c8b8ff, transparent),
      radial-gradient(1px 1px at 45% 15%, #fff, transparent),
      radial-gradient(1px 1px at 70% 50%, #d0c0ff, transparent);
    opacity: 0.7;
    animation: twinkle 4s ease-in-out infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 0.9; }
  }

  .center-sigil {
    position: fixed; top: 50%; left: 50%;
    width: min(80vmin, 720px); height: min(80vmin, 720px);
    transform: translate(-50%, -50%);
    z-index: 0; pointer-events: none;
    background-image: url("kabbalah.png");
    background-size: contain; background-position: center; background-repeat: no-repeat;
    opacity: 0.10;
    animation: sigilBreath 14s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  @keyframes sigilBreath {
    0%, 100% { opacity: 0.08; transform: translate(-50%, -50%) scale(1) rotate(0deg); }
    50%      { opacity: 0.14; transform: translate(-50%, -50%) scale(1.03) rotate(1.5deg); }
  }

  .wrap {
    position: relative; z-index: 1;
    max-width: 1000px; margin: 0 auto;
    padding: 32px 20px 80px;
  }

  .panel {
    position: relative;
    background:
      linear-gradient(160deg, rgba(40,25,70,0.9) 0%, rgba(20,10,40,0.95) 100%);
    border: 1px solid rgba(200,170,90,0.55);
    padding: 30px 28px;
    margin-bottom: 22px;
    box-shadow:
      0 0 0 1px rgba(80,50,120,0.5),
      inset 0 0 40px rgba(120,90,200,0.18),
      0 8px 40px rgba(0,0,0,0.6);
    clip-path: polygon(
      16px 0, 100% 0, 100% calc(100% - 16px),
      calc(100% - 16px) 100%, 0 100%, 0 16px
    );
  }
  .panel::before {
    content: "";
    position: absolute;
    inset: 5px;
    border: 1px solid rgba(200,170,90,0.25);
    clip-path: polygon(
      12px 0, 100% 0, 100% calc(100% - 12px),
      calc(100% - 12px) 100%, 0 100%, 0 12px
    );
    pointer-events: none;
  }

  #loginScreen, #teacherScreen {
    display: flex; align-items: center; justify-content: center;
    min-height: 100vh; padding: 20px;
    position: relative; z-index: 2;
  }
  #teacherScreen { display: none; }

  .login-box { width: 100%; max-width: 600px; }

  .login-title {
    font-size: 28px;
    letter-spacing: 8px;
    text-align: center;
    color: var(--gold);
    margin-bottom: 6px;
    font-weight: 600;
    text-shadow: 0 0 20px rgba(232,198,106,0.7), 0 0 40px rgba(220,180,80,0.4);
    display: flex;
    align-items: center;
    gap: 14px;
    justify-content: center;
  }
  .login-title::before,
  .login-title::after {
    content: "";
    flex: 1;
    height: 1px;
    background: linear-gradient(to right, transparent, rgba(232,198,106,0.7), transparent);
  }

  .login-sub {
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 4px;
    margin-bottom: 32px;
    font-style: italic;
  }

  .field-label {
    font-size: 13px;
    letter-spacing: 3px;
    color: var(--gold);
    margin-bottom: 8px;
    margin-top: 4px;
    display: block;
  }

  .magic-input {
    display: block;
    width: 100%;
    padding: 14px 18px;
    margin-bottom: 18px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 2px;
    color: var(--text-main);
    background: rgba(20,10,40,0.7);
    border: 1px solid rgba(200,170,90,0.5);
    border-radius: 2px;
    outline: none;
    transition: all 0.3s;
    box-shadow: inset 0 0 12px rgba(80,50,150,0.5);
  }
  .magic-input::placeholder { color: #8878a8; }
  .magic-input:focus {
    border-color: var(--gold);
    box-shadow: inset 0 0 18px rgba(160,120,255,0.6), 0 0 20px rgba(200,170,90,0.5);
  }

  textarea.magic-input {
    min-height: 90px;
    font-family: inherit;
    resize: vertical;
    line-height: 1.8;
  }

  .pass-wrap { position: relative; margin-bottom: 18px; }
  .pass-wrap .magic-input { margin-bottom: 0; padding-right: 50px; }
  .eye-btn {
    position: absolute;
    right: 14px; top: 50%;
    transform: translateY(-50%);
    width: 28px; height: 28px;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    color: var(--text-dim);
    transition: color 0.3s;
    background: transparent; border: none; padding: 0;
  }
  .eye-btn:hover { color: var(--gold); }
  .eye-btn svg {
    width: 20px; height: 20px;
    fill: none; stroke: currentColor;
    stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round;
  }
  .eye-btn .eye-off { display: none; }
  .eye-btn.on .eye-on { display: none; }
  .eye-btn.on .eye-off { display: block; }

  .select-wrap { position: relative; margin-bottom: 18px; }
  .select-wrap::after {
    content: "▾";
    position: absolute;
    right: 18px; top: 50%;
    transform: translateY(-50%);
    color: var(--gold);
    font-size: 14px;
    pointer-events: none;
  }
  .magic-select {
    display: block;
    width: 100%;
    padding: 14px 44px 14px 18px;
    font-size: 15px;
    font-family: inherit;
    letter-spacing: 2px;
    color: var(--text-main);
    background: rgba(20,10,40,0.7);
    border: 1px solid rgba(200,170,90,0.5);
    border-radius: 2px;
    outline: none;
    transition: all 0.3s;
    appearance: none; -webkit-appearance: none;
    cursor: pointer;
    box-shadow: inset 0 0 12px rgba(80,50,150,0.5);
  }
  .magic-select:focus {
    border-color: var(--gold);
    box-shadow: inset 0 0 18px rgba(160,120,255,0.6), 0 0 20px rgba(200,170,90,0.5);
  }
  .magic-select option { background: #150a28; color: var(--text-main); }

  .magic-btn {
    position: relative;
    display: block;
    width: 100%;
    padding: 16px 36px;
    margin-top: 8px;
    font-family: inherit;
    font-size: 15px;
    letter-spacing: 5px;
    color: #fff8e0;
    background:
      linear-gradient(180deg, #6a4fd0 0%, #3a2a8a 50%, #2a1a6a 100%);
    border: 1px solid var(--gold);
    border-radius: 2px;
    cursor: pointer;
    overflow: hidden;
    text-shadow: 0 0 8px rgba(255,220,120,0.9);
    box-shadow:
      inset 0 0 20px rgba(180,150,255,0.4),
      inset 0 2px 0 rgba(255,255,255,0.2),
      0 0 20px rgba(120,90,220,0.5);
    transition: all 0.35s ease;
    clip-path: polygon(
      10px 0, 100% 0, 100% calc(100% - 10px),
      calc(100% - 10px) 100%, 0 100%, 0 10px
    );
  }
  .magic-btn::before {
    content: "";
    position: absolute;
    top: 0; left: -100%;
    width: 60%; height: 100%;
    background: linear-gradient(100deg, transparent, rgba(255,240,200,0.6), transparent);
    transform: skewX(-20deg);
    animation: sweep 3s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes sweep {
    0%   { left: -100%; }
    60%  { left: 130%; }
    100% { left: 130%; }
  }
  .magic-btn:hover {
    transform: translateY(-2px);
    box-shadow:
      inset 0 0 30px rgba(200,170,255,0.6),
      inset 0 2px 0 rgba(255,255,255,0.3),
      0 0 40px rgba(160,120,255,0.9);
  }
  .magic-btn.small {
    width: auto;
    padding: 8px 18px;
    font-size: 13px;
    letter-spacing: 3px;
    margin: 0;
  }
  .magic-btn.big {
    padding: 20px 36px;
    font-size: 17px;
    letter-spacing: 8px;
    margin-bottom: 20px;
  }
  .magic-btn.danger {
    background: linear-gradient(180deg, #b03050 0%, #6a1a30 50%, #4a0e1e 100%);
    border-color: #e87090;
  }
  .magic-btn.danger:hover {
    box-shadow: inset 0 0 30px rgba(255,150,180,0.6), 0 0 40px rgba(220,90,130,0.9);
  }
  .magic-btn.success {
    background: linear-gradient(180deg, #3aa070 0%, #1a6040 50%, #0a3a26 100%);
    border-color: #7ae0b0;
  }
  .magic-btn.success:hover {
    box-shadow: inset 0 0 30px rgba(150,255,200,0.6), 0 0 40px rgba(90,220,150,0.9);
  }
  .magic-btn.ghost {
    background: linear-gradient(180deg, rgba(80,60,120,0.6) 0%, rgba(30,20,60,0.8) 100%);
    border-color: rgba(180,150,220,0.5);
  }

  .teacher-entry {
    position: fixed !important;
    right: 0 !important; top: 50% !important;
    left: auto !important; bottom: auto !important;
    transform: translateY(-50%) !important;
    z-index: 9998 !important;
    padding: 24px 18px;
    background: linear-gradient(160deg, rgba(60,40,100,0.95), rgba(20,10,40,0.98));
    border: 1px solid var(--gold);
    border-right: none;
    border-radius: 12px 0 0 12px;
    font-size: 13px;
    letter-spacing: 5px;
    color: var(--gold);
    cursor: pointer;
    transition: all 0.4s cubic-bezier(0.2, 0.8, 0.2, 1);
    box-shadow: -4px 0 20px rgba(120,90,220,0.5), inset 0 0 20px rgba(200,170,90,0.15);
    text-shadow: 0 0 10px rgba(232,198,106,0.9);
    writing-mode: vertical-rl;
    text-orientation: upright;
    display: flex; align-items: center; justify-content: center;
    gap: 10px;
    user-select: none;
  }
  .teacher-entry::before {
    content: "";
    position: absolute;
    left: 0; top: 15%; bottom: 15%;
    width: 2px;
    background: linear-gradient(to bottom, transparent, var(--gold), transparent);
    animation: teacherGlow 2.5s ease-in-out infinite;
    border-radius: 2px;
  }
  @keyframes teacherGlow {
    0%, 100% { opacity: 0.4; }
    50%      { opacity: 1; }
  }
  .teacher-entry:hover {
    transform: translateY(-50%) translateX(-6px) !important;
    color: #fff8e0;
    border-color: #fff0b0;
    box-shadow: -8px 0 40px rgba(232,198,106,0.7), inset 0 0 26px rgba(220,180,90,0.3);
    text-shadow: 0 0 18px rgba(255,240,180,1);
    padding-right: 24px;
  }

  .screen-flip-out {
    animation: flipOut 0.7s cubic-bezier(0.6, 0, 0.4, 1) forwards;
    transform-origin: left center;
    backface-visibility: hidden;
    pointer-events: none;
  }
  @keyframes flipOut {
    0%   { transform: perspective(1400px) rotateY(0deg); opacity: 1; }
    100% { transform: perspective(1400px) rotateY(-100deg); opacity: 0; }
  }
  .screen-flip-in {
    animation: flipIn 0.7s cubic-bezier(0.6, 0, 0.4, 1) forwards;
    transform-origin: right center;
    backface-visibility: hidden;
  }
  @keyframes flipIn {
    0%   { transform: perspective(1400px) rotateY(100deg); opacity: 0; }
    100% { transform: perspective(1400px) rotateY(0deg); opacity: 1; }
  }

  #mainScreen { display: none; }

  .topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 0 22px;
    border-bottom: 1px solid rgba(200,170,90,0.3);
    margin-bottom: 24px;
    flex-wrap: wrap;
    gap: 14px;
  }
  .topbar-left { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .user-info {
    font-size: 15px;
    letter-spacing: 2px;
    color: var(--gold);
    text-shadow: 0 0 10px rgba(232,198,106,0.5);
  }
  .user-house {
    font-size: 13px;
    color: var(--text-soft);
    letter-spacing: 2px;
    margin-left: 10px;
  }
  .topbar-right { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }

  .world-time {
    font-family: "Cinzel", "Cormorant Garamond", serif;
    font-size: 14px;
    letter-spacing: 2px;
    color: var(--gold);
    padding: 8px 18px;
    border: 1px solid rgba(200,170,90,0.5);
    background: rgba(20,10,40,0.6);
    display: flex; align-items: center; gap: 10px;
    box-shadow: inset 0 0 12px rgba(80,50,150,0.4);
  }
  .world-time .season { color: var(--gold); text-shadow: 0 0 10px rgba(232,198,106,0.8); }
  .world-time .sep { color: rgba(232,198,106,0.4); }
  .world-time .festival {
    color: #ff9ec8;
    text-shadow: 0 0 12px rgba(255,150,200,0.9);
    animation: pulse 1.6s ease-in-out infinite;
  }

  .tabs { display: flex; gap: 10px; margin-bottom: 22px; flex-wrap: wrap; }
  .tab {
    padding: 11px 22px;
    font-family: inherit;
    font-size: 14px;
    letter-spacing: 3px;
    color: var(--text-dim);
    background: rgba(20,10,40,0.6);
    border: 1px solid rgba(200,170,90,0.25);
    cursor: pointer;
    transition: all 0.35s;
    clip-path: polygon(8px 0, 100% 0, 100% calc(100% - 8px), calc(100% - 8px) 100%, 0 100%, 0 8px);
  }
  .tab:hover { color: var(--gold); border-color: rgba(200,170,90,0.6); }
  .tab.active {
    color: #fff8e0;
    background: linear-gradient(180deg, rgba(106,79,208,0.8) 0%, rgba(58,42,138,0.9) 100%);
    border-color: var(--gold);
    box-shadow: inset 0 0 20px rgba(200,170,255,0.4), 0 0 20px rgba(120,90,220,0.6);
    text-shadow: 0 0 10px rgba(255,220,120,0.9);
  }

  .collapse-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 18px 24px;
    background: linear-gradient(180deg, rgba(106,79,208,0.7) 0%, rgba(58,42,138,0.85) 100%);
    border: 1px solid var(--gold);
    cursor: pointer;
    transition: all 0.35s;
    clip-path: polygon(12px 0, 100% 0, 100% calc(100% - 12px), calc(100% - 12px) 100%, 0 100%, 0 12px);
    margin-bottom: 16px;
    box-shadow: inset 0 0 20px rgba(200,170,255,0.3), 0 0 24px rgba(120,90,220,0.5);
  }
  .collapse-header:hover {
    box-shadow: inset 0 0 30px rgba(200,170,255,0.5), 0 0 40px rgba(160,120,255,0.8);
  }
  .collapse-header .title {
    font-size: 17px;
    letter-spacing: 5px;
    color: #fff8e0;
    text-shadow: 0 0 12px rgba(255,220,120,0.9);
  }
  .collapse-header .count {
    font-size: 14px;
    color: var(--gold);
    letter-spacing: 2px;
    margin-left: 12px;
  }
  .collapse-header .arrow {
    font-size: 18px;
    color: var(--gold);
    transition: transform 0.35s;
    text-shadow: 0 0 12px rgba(232,198,106,0.9);
  }
  .collapse-header.open .arrow {
    transform: rotate(180deg);
  }
  .collapse-body {
    overflow: hidden;
    max-height: 0;
    transition: max-height 0.5s ease;
  }
  .collapse-body.open {
    max-height: 5000px;
  }

  .quest-card {
    position: relative;
    background: rgba(20,10,40,0.6);
    border: 1px solid rgba(200,170,90,0.3);
    padding: 20px 22px;
    margin-bottom: 14px;
    transition: all 0.35s;
    clip-path: polygon(10px 0, 100% 0, 100% calc(100% - 10px), calc(100% - 10px) 100%, 0 100%, 0 10px);
  }
  .quest-card:hover {
    border-color: var(--gold);
    background: rgba(40,25,70,0.7);
    box-shadow: inset 0 0 30px rgba(120,90,200,0.25), 0 0 24px rgba(120,90,220,0.4);
  }
  .quest-title {
    font-size: 17px;
    letter-spacing: 2px;
    color: var(--gold);
    margin-bottom: 10px;
    text-shadow: 0 0 10px rgba(232,198,106,0.5);
  }
  .quest-desc { font-size: 15px; line-height: 1.9; color: var(--text-soft); margin-bottom: 8px; }
  .quest-reward { font-size: 14px; color: var(--gold); letter-spacing: 1px; margin-bottom: 10px; opacity: 0.9; }

  .status-badge {
    display: inline-block;
    font-size: 12px;
    letter-spacing: 2px;
    padding: 4px 12px;
    margin-right: 8px;
    border: 1px solid;
    clip-path: polygon(6px 0, 100% 0, 100% calc(100% - 6px), calc(100% - 6px) 100%, 0 100%, 0 6px);
  }
  .s-open { background: rgba(60,180,120,0.2); color: #8ee0b0; border-color: rgba(140,255,190,0.5); }
  .s-pending { background: rgba(230,180,60,0.2); color: #f0d090; border-color: rgba(255,220,140,0.5); }
  .s-doing { background: rgba(80,150,255,0.2); color: #a8c8ff; border-color: rgba(140,190,255,0.5); }
  .s-done { background: rgba(150,150,150,0.2); color: #b0b0b0; border-color: rgba(180,180,180,0.5); }
  .s-rejected { background: rgba(200,70,70,0.2); color: #ffa0a0; border-color: rgba(255,140,140,0.5); }
  .s-overdue { background: rgba(200,70,70,0.3); color: #ff8888; border-color: rgba(255,120,120,0.6); }

  .empty-hint {
    text-align: center;
    padding: 50px 20px;
    color: var(--text-dim);
    font-size: 15px;
    letter-spacing: 2px;
    font-style: italic;
  }

  .house-group { margin-bottom: 30px; }
  .house-group-title {
    font-size: 16px;
    letter-spacing: 4px;
    color: var(--gold);
    padding-bottom: 10px;
    margin-bottom: 16px;
    border-bottom: 1px solid rgba(200,170,90,0.3);
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    text-shadow: 0 0 10px rgba(232,198,106,0.5);
  }
  .house-group-title small { font-size: 13px; color: var(--text-soft); letter-spacing: 2px; }
  .student-row {
    padding: 14px 18px;
    background: rgba(20,10,40,0.5);
    border: 1px solid rgba(200,170,90,0.2);
    border-left: 3px solid var(--gold);
    margin-bottom: 10px;
    font-size: 15px;
    line-height: 1.8;
    color: var(--text-soft);
  }
  .student-row .name { color: var(--text-main); letter-spacing: 2px; font-size: 16px; }
  .student-row .grade {
    font-size: 12px;
    color: var(--gold);
    margin-left: 10px;
    padding: 2px 10px;
    border: 1px solid rgba(200,170,90,0.5);
    border-radius: 10px;
  }
  .student-row .quest-info {
    margin-top: 8px;
    padding-left: 14px;
    border-left: 1px dashed rgba(200,170,90,0.35);
    font-size: 14px;
    color: var(--text-soft);
  }

  .comment-item {
    padding: 10px 14px;
    margin-bottom: 10px;
    background: rgba(20,10,40,0.5);
    border-left: 2px solid var(--gold);
    font-size: 14px;
    line-height: 1.8;
  }
  .comment-item .meta { color: var(--gold); font-size: 13px; margin-bottom: 4px; opacity: 0.85; }
  .comment-item .text { color: var(--text-soft); }

  #loadingOverlay {
    position: fixed; inset: 0; z-index: 9999;
    background: #0a0618;
    display: none; align-items: center; justify-content: center;
    flex-direction: column; gap: 30px;
  }
  #loadingOverlay.show { display: flex; }
  .magic-circle { position: relative; width: 240px; height: 240px; }
  .magic-circle .rune-ring {
    position: absolute; inset: 0; border-radius: 50%;
    animation: spinSlow 24s linear infinite;
    transform-origin: center;
  }
  .magic-circle .rune-ring svg { width: 100%; height: 100%; overflow: visible; }
  .magic-circle .rune-ring svg text {
    fill: rgba(232,198,106,0.85);
    font-family: 'Cinzel', serif;
    font-size: 13px;
    letter-spacing: 2px;
    text-shadow: 0 0 8px rgba(232,198,106,0.9);
  }
  .magic-circle .rune-ring-2 {
    position: absolute; inset: 20px; border-radius: 50%;
    animation: spinSlowRev 18s linear infinite;
    transform-origin: center;
  }
  .magic-circle .rune-ring-2 svg { width: 100%; height: 100%; overflow: visible; }
  .magic-circle .rune-ring-2 svg text {

const LOCATIONS = [
  "缄默林外围","林中小屋","中央广场","弥拉瑟尔塑像","社团广场","宴会大厅","公共活动室","荣誉长廊",

];

  "11-15": "南十字星夜",
  "12-21": "太阳祭",
  "12-24": "源典环日",
  "1-25": "银雨节",
  "4-10": "校庆日",
  "4-11": "校庆日",
  "4-12": "校庆日",
  "4-13": "校庆日",
  "5-1": "鲜花节",
  "6-22": "仲夏夜庆典"
};

const HEADERS = {
  "apikey": SUPABASE_KEY,
  "Authorization": "Bearer " + SUPABASE_KEY,
  "Content-Type": "application/json",
  "Prefer": "return=representation"
};

let session = { role: null, name: null, house: null, position: null, grade: null, location: "阿斐理恩" };

/* ==================== 工具 ==================== */
function esc(s) {
  return String(s || "").replace(/[&<>"']/g, m => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
  }[m]));
}

function highlight(text, keyword) {
  if (!keyword) return esc(text);
  const safe = esc(text);
  const k = esc(keyword);
  if (!k) return safe;
  const escaped = k.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const re = new RegExp(escaped, "gi");
  return safe.replace(re, m => `<mark class="highlight">${m}</mark>`);
}

async function api(path, opts = {}) {
  const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, {
    ...opts,
    headers: { ...HEADERS, ...(opts.headers || {}) }
  });
  const text = await res.text();
  let data = null;
  try { data = text ? JSON.parse(text) : null; } catch { data = text; }
  if (!res.ok) throw new Error(typeof data === "object" ? JSON.stringify(data) : data);
  return data;
}

function showLoading(text = "正 在 连 接 魔 法 网 络") {
  document.getElementById("loadingText").textContent = text;
  document.getElementById("loadingOverlay").classList.add("show");
}
function hideLoading() {
  document.getElementById("loadingOverlay").classList.remove("show");
}
function openModal(html) {
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("modal").classList.add("show");
}
function closeModal() {
  document.getElementById("modal").classList.remove("show");
}
function toggleEye(inputId, btn) {
  const inp = document.getElementById(inputId);
  if (inp.type === "password") { inp.type = "text"; btn.classList.add("on"); }
  else { inp.type = "password"; btn.classList.remove("on"); }
}

/* ==================== 世界历 ==================== */
function getWorldDate() {
  const now = new Date();
  const year = now.getFullYear();
  const month = now.getMonth() + 1;
  const day = now.getDate();
  let season;
  if (month >= 9 && month <= 11) season = "植收季";
  else if (month === 12 || month <= 2) season = "冰雪季";
  else if (month >= 3 && month <= 5) season = "萌芽季";
  else season = "谷收季";
  const festival = FESTIVALS[`${month}-${day}`] || null;
  return { year, month, day, season, festival };
}
function renderWorldTime() {
  const w = getWorldDate();
  const el = document.getElementById("worldTime");
  if (!el) return;
  let html = `世界历 <span class="season">${w.year}</span> <span class="sep">·</span> ${w.month} <span class="sep">·</span> ${w.day} <span class="sep">·</span> <span class="season">${w.season}</span>`;
  if (w.festival) html += ` <span class="sep">·</span> <span class="festival">✦ ${w.festival}</span>`;
  el.innerHTML = html;
  setTimeout(renderWorldTime, 60000);
}

function gradeText(grade) {
  if (!grade) return "";
  return `${grade} 年级`;
}

function isQuestOverdue(q) {
  if (!q || !q.deadline_days || !q.created_at) return false;
  if (q.status === "done") return false;
  const created = new Date(q.created_at).getTime();
  const deadline = created + q.deadline_days * 24 * 60 * 60 * 1000;
  return Date.now() > deadline;
}
function deadlineText(q) {
  if (!q.deadline_days) return "";
  return `⏰ 截止：发布后 ${q.deadline_days} 天`;
}

/* ==================== 登录 ==================== */
async function doLogin() {
  const name = document.getElementById("loginName").value.trim();
  const pass = document.getElementById("loginPass").value;
  const house = document.getElementById("loginHouse").value;

  if (!name) { alert("请告诉我你的名谓。"); return; }
  if (!house) { alert("请选择你的学院。"); return; }
  if (pass !== STUDENT_PASSWORD) { alert("通行密码不正确。"); return; }

  showLoading("正 在 唤 醒 魔 法 阵");

  try {
    const existing = await api(`students?name=eq.${encodeURIComponent(name)}&select=*`);
    if (existing && existing.length) {
      const stu = existing[0];
      const patch = {};
      if (stu.house !== house) patch.house = house;
      if (!stu.role) patch.role = "student";
      if (!stu.grade) patch.grade = 1;
      if (Object.keys(patch).length) {
        await api(`students?name=eq.${encodeURIComponent(name)}`, {
          method: "PATCH",
          body: JSON.stringify(patch)
        });
      }
      session = {
        role: "student", name, house,
        grade: stu.grade || 1,
        location: stu.location || "阿斐理恩"
      };
    } else {
      await api(`students`, {
        method: "POST",
        body: JSON.stringify({ name, house, role: "student", grade: 1, location: "阿斐理恩" })
      });
      session = { role: "student", name, house, grade: 1, location: "阿斐理恩" };
    }
  } catch (e) {
    console.warn("学生记录失败:", e);
    session = { role: "student", name, house, grade: 1, location: "阿斐理恩" };
  }

  setTimeout(() => { hideLoading(); enterSystem(); }, 1600);
}

function flipToTeacher() {
  const login = document.getElementById("loginScreen");
  const teacher = document.getElementById("teacherScreen");
  const entry = document.getElementById("teacherEntry");
  if (entry) entry.style.display = "none";
  login.classList.add("screen-flip-out");
  setTimeout(() => {
    login.style.display = "none";
    login.classList.remove("screen-flip-out");
    teacher.style.display = "flex";

async function renderStudentContent() {

async function renderQuestBoard() {
  const quests = await api(`quests?select=*&order=created_at.desc`);
  const all = Array.isArray(quests) ? quests : [];
  const openQuests = all.filter(q => q.status === "open");
  const myClaims = await api(`claims?student_name=eq.${encodeURIComponent(session.name)}&select=*`);
  const claimList = Array.isArray(myClaims) ? myClaims : [];
  const myDoing = claimList.filter(c => c.status !== "completed" && c.status !== "rejected");
  const questMap = {};
  all.forEach(q => questMap[q.id] = q);
  const doingQuests = myDoing.map(c => ({ claim: c, quest: questMap[c.quest_id] })).filter(x => x.quest);

  const box = document.getElementById("tabContents");
  const total = openQuests.length + doingQuests.length;

  box.innerHTML = `
    <div class="panel" style="padding:0;background:transparent;border:none;box-shadow:none;">
      <div class="collapse-header ${questBoardOpen ? 'open' : ''}" onclick="toggleQuestBoard()">
        <div>
          <span class="title">课 题 领 取</span>
          <span class="count">（${total}）</span>
        </div>
        <span class="arrow">▾</span>
      </div>
      <div class="collapse-body ${questBoardOpen ? 'open' : ''}">
        ${total === 0 ? `<div class="empty-hint">暂 无 可 领 取 或 进 行 中 的 课 题</div>` : ""}
        ${doingQuests.length ? `
          <div style="margin-bottom:20px;">
            <div class="search-section-title"><span>进 行 中 的 课 题</span><small>${doingQuests.length}</small></div>
            ${doingQuests.map(x => renderQuestCard(x.quest, x.claim)).join("")}
          </div>
        ` : ""}
        ${openQuests.length ? `
          <div>
            <div class="search-section-title"><span>可 领 取 的 课 题</span><small>${openQuests.length}</small></div>
            ${openQuests.map(q => renderQuestCard(q, null)).join("")}
          </div>
        ` : ""}
      </div>
    </div>
  `;
}

function toggleQuestBoard() {
  questBoardOpen = !questBoardOpen;
  renderQuestBoard();
}

function renderQuestCard(q, claim) {
  const overdue = isQuestOverdue(q);
  const canClaim = !claim && q.status === "open";
  return `
    <div class="quest-card">
      <div class="quest-title">${esc(q.title)}</div>
      ${q.description ? `<div class="quest-desc">${esc(q.description)}</div>` : ""}
      ${q.location ? `<div class="quest-reward">📍 地点：${esc(q.location)}</div>` : ""}
      ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
      ${q.reward ? `<div class="quest-reward">✦ 奖励：${esc(q.reward)}</div>` : ""}
      ${q.max_claims ? `<div class="quest-reward">👥 已接：${q.claimed_count || 0} / ${q.max_claims}</div>` : ""}
      ${q.deadline_days ? `<div class="quest-reward">${deadlineText(q)}</div>` : ""}
      <span class="status-badge ${statusClass(q.status)}">${statusText(q.status)}</span>
      ${overdue ? `<span class="status-badge s-overdue">已超时</span>` : ""}
      ${canClaim ? `<button class="magic-btn small" style="margin-left:8px" onclick="claimQuest(${q.id})">领 取</button>` : ""}
    </div>
  `;
}

function statusText(s) {
  return ({ open:"可领取", taken:"审核中", doing:"进行中", done:"已完成", rejected:"已驳回", pending:"待审核", approved:"进行中", completed:"已完成" })[s] || s;
}
function statusClass(s) {
  return ({ open:"s-open", taken:"s-pending", doing:"s-doing", done:"s-done", rejected:"s-rejected", pending:"s-pending", approved:"s-doing", completed:"s-done" })[s] || "s-open";
}

async function claimQuest(questId) {
  showLoading("正 在 提 交 申 请");
  try {
    const qArr = await api(`quests?id=eq.${questId}&select=*`);
    if (!qArr || !qArr.length) { hideLoading(); alert("课题不存在"); return; }
    const q = qArr[0];
    if (q.status !== "open") {
      hideLoading();
      alert("这个课题已经不可以领取了。");
      renderStudentContent();
      return;
    }
    const mine = await api(`claims?quest_id=eq.${questId}&student_name=eq.${encodeURIComponent(session.name)}&select=*`);
    if (mine && mine.length) {
      hideLoading();
      alert("你已经接过这个课题了。");
      return;
    }
    const res = await fetch(`${SUPABASE_URL}/rest/v1/claims`, {
      method: "POST",
      headers: HEADERS,
      body: JSON.stringify({
        quest_id: questId,
        student_name: session.name,
        house: session.house,
        status: "pending"
      })
    });
    if (!res.ok) {
      hideLoading();
      alert("提交失败：" + await res.text());
      return;
    }
    const newCount = (q.claimed_count || 0) + 1;
    const patch = { claimed_count: newCount };
    if (newCount >= (q.max_claims || 1)) patch.status = "taken";
    await api(`quests?id=eq.${questId}`, {
      method: "PATCH",
      body: JSON.stringify(patch)
    });
    setTimeout(() => {
      hideLoading();
      alert("领取成功，等待教师审核。");
      renderStudentContent();
    }, 800);
  } catch (e) {
    hideLoading();
    alert("操作失败：" + e.message);
  }
}

async function renderMyQuests() {
  const claims = await api(`claims?student_name=eq.${encodeURIComponent(session.name)}&select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);

  const box = document.getElementById("tabContents");
  if (!Array.isArray(claims) || !claims.length) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">你 还 没 有 领 取 任 何 课 题</div></div>`;
    return;
  }
  box.innerHTML = `<div class="panel">${claims.map(c => {
    const q = questMap[c.quest_id] || {};
    const itemsStatus = c.items_status || "none";
    const overdue = isQuestOverdue(q) && c.status !== "completed";
    let itemLine = "";
    if (c.items) {
      itemLine = `<div class="quest-desc">物品：${esc(c.items)} <span class="status-badge ${itemStatusClass(itemsStatus)}">${itemStatusText(itemsStatus)}</span></div>`;
    }
    const canSubmit = c.status === "doing" || c.status === "approved" || (c.status === "completed" && itemsStatus === "rejected");
    return `
      <div class="quest-card">
        <div class="quest-title">${esc(q.title || "（课题已删除）")}</div>
        ${q.location ? `<div class="quest-reward">📍 ${esc(q.location)}</div>` : ""}
        ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
        ${q.deadline_days ? `<div class="quest-reward">${deadlineText(q)}</div>` : ""}
        <span class="status-badge ${statusClass(c.status)}">${statusText(c.status)}</span>
        ${overdue ? `<span class="status-badge s-overdue">已超时</span>` : ""}
        ${itemLine}
        ${canSubmit ? `<button class="magic-btn small" style="margin-top:10px" onclick="openSubmitItems(${c.id}, '${esc(q.title || "")}')">提 交 物 品</button>` : ""}
      </div>
    `;
  }).join("")}</div>`;
}

function itemStatusText(s) {
  return ({ none:"", pending:"待审核", approved:"已通过", rejected:"已驳回" })[s] || "";
}
function itemStatusClass(s) {
  return ({ pending:"s-pending", approved:"s-open", rejected:"s-rejected" })[s] || "";
}

async function loadPosts() {
  const listEl = document.getElementById("postList");
  if (!listEl) return;
  listEl.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    const allPosts = await api(`posts?select=*&order=created_at.desc`);
    const posts = (allPosts || []).filter(p =>
      p.status === "approved" || p.author === session.name
    );
    if (!posts.length) {
      listEl.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 帖 子</div></div>`;
      return;
    }
    const comments = await api(`post_comments?select=*&order=created_at.asc`);
    const commentMap = {};
    (comments || []).forEach(c => {
      if (!commentMap[c.post_id]) commentMap[c.post_id] = [];
      commentMap[c.post_id].push(c);
    });
    listEl.innerHTML = `<div class="panel">${posts.map(p => {
      const myComments = commentMap[p.id] || [];
      let statusLine = "";
      if (p.status === "pending") statusLine = `<div class="quest-reward" style="color:#f0d090;">⏳ 审核中</div>`;
      if (p.status === "rejected") statusLine = `<div class="quest-reward" style="color:#ffa0a0;">✕ 已被驳回</div>`;
      return `
        <div class="quest-card">
          <div class="quest-title">${esc(p.title || "（无标题）")}</div>
          <div class="quest-desc">${esc(p.content)}</div>
          <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")}</div>
          ${statusLine}
          <button class="magic-btn small" onclick="likePost(${p.id}, ${p.likes || 0})">♡ 点赞 ${p.likes || 0}</button>
          <button class="magic-btn small" style="margin-left:8px" onclick="toggleComments(${p.id})">评 论 (${myComments.length})</button>
          <div id="comments-${p.id}" style="display:none;margin-top:16px;padding-top:16px;border-top:1px dashed rgba(200,170,90,0.35);">
            ${myComments.map(c => `
              <div class="comment-item">
                <div class="meta">${esc(c.author)} · ${new Date(c.created_at).toLocaleString("zh-CN")}</div>
                <div class="text">${esc(c.content)}</div>
              </div>
            `).join("")}
            <div style="display:flex;gap:10px;margin-top:12px;">
              <input type="text" id="commentInput-${p.id}" class="magic-input" style="margin:0;flex:1;" placeholder="写评论...">
              <button class="magic-btn small" onclick="submitComment(${p.id})">发 送</button>
            </div>
          </div>
        </div>
      `;
    }).join("")}</div>`;
  } catch (e) {
    listEl.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

    const msgs = await api(`messages?to_user=eq.${encodeURIComponent(session.name)}&select=*&order=created_at.desc`);
    if (!Array.isArray(msgs) || !msgs.length) {
      box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 消 息</div></div>`;
      return;
    }
    box.innerHTML = `<div class="panel">${msgs.map(m => `
      <div class="quest-card" style="${m.is_read ? "" : "border-color:rgba(232,198,106,0.7);box-shadow:0 0 24px rgba(232,198,106,0.3);"}">
        <div class="quest-title" style="${m.is_read ? "" : "color:#f0d090;"}">${m.is_read ? "系统消息" : "✦ 新消息"}</div>
        <div class="quest-desc">${esc(m.content)}</div>
        <div class="quest-reward">${new Date(m.created_at).toLocaleString("zh-CN")}</div>
        ${m.is_read ? "" : `<button class="magic-btn small" onclick="markRead(${m.id})">标 记 已 读</button>`}
      </div>
    `).join("")}</div>`;
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function markRead(msgId) {
  await api(`messages?id=eq.${msgId}`, {
    method: "PATCH",
    body: JSON.stringify({ is_read: true })
  });
  renderMyMessages();
}

/* ==================== 搜索 ==================== */
async function renderSearch() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `
    <div class="panel">
      <div class="login-title" style="font-size:20px;margin-bottom:22px;">全 站 搜 索</div>
      <input type="text" id="searchInput" class="magic-input" placeholder="输入关键词..." oninput="doSearch()">
    </div>
    <div id="searchResults"></div>
  `;
}

async function doSearch() {
  const keyword = (document.getElementById("searchInput")?.value || "").trim();
  const results = document.getElementById("searchResults");
  if (!results) return;

  if (!keyword) { results.innerHTML = ""; return; }

  results.innerHTML = `<div class="panel"><div class="empty-hint">搜 索 中 ...</div></div>`;

  try {
    const [posts, students, quests] = await Promise.all([
      api(`posts?status=eq.approved&select=*&order=created_at.desc`),
      api(`students?select=*`),
      api(`quests?select=*`)
    ]);

    const kw = keyword.toLowerCase();
    const postHits = (posts || []).filter(p =>
      (p.title || "").toLowerCase().includes(kw) ||
      (p.content || "").toLowerCase().includes(kw) ||
      (p.author || "").toLowerCase().includes(kw)
    );
    const stuHits = (students || []).filter(s =>
      s.role !== "teacher" && s.role !== "super" &&
      ((s.name || "").toLowerCase().includes(kw) || (s.house || "").toLowerCase().includes(kw))
    );
    const teacherHits = (students || []).filter(s =>
      (s.role === "teacher" || s.role === "super") &&
      ((s.name || "").toLowerCase().includes(kw) || (s.position || "").toLowerCase().includes(kw))
    );
    const questHits = (quests || []).filter(q =>
      (q.title || "").toLowerCase().includes(kw) ||
      (q.description || "").toLowerCase().includes(kw) ||
      (q.location || "").toLowerCase().includes(kw)
    );

    let html = "";

    if (postHits.length) {
      html += `<div class="panel">
        <div class="search-section-title"><span>📝 帖 子</span><small>${postHits.length}</small></div>
        ${postHits.map(p => `
          <div class="quest-card">
            <div class="quest-title">${highlight(p.title || "（无标题）", keyword)}</div>
            <div class="quest-desc">${highlight(p.content, keyword)}</div>
            <div class="quest-reward">${highlight(p.author, keyword)} · ${new Date(p.created_at).toLocaleString("zh-CN")}</div>
          </div>
        `).join("")}
      </div>`;
    }

    if (stuHits.length) {
      html += `<div class="panel">
        <div class="search-section-title"><span>🎓 学 生</span><small>${stuHits.length}</small></div>
        ${stuHits.map(s => `
          <div class="student-row">
            <div class="name">${highlight(s.name, keyword)}<span class="grade">${esc(s.house || "")}</span></div>
          </div>
        `).join("")}
      </div>`;
    }

    if (teacherHits.length) {
      html += `<div class="panel">
        <div class="search-section-title"><span>👨‍🏫 教 师</span><small>${teacherHits.length}</small></div>
        ${teacherHits.map(s => `
          <div class="student-row">
            <div class="name">${highlight(s.name, keyword)}<span class="grade">${highlight(s.position || "", keyword)}</span></div>
          </div>
        `).join("")}
      </div>`;
    }

    if (questHits.length) {
      html += `<div class="panel">
        <div class="search-section-title"><span>📚 课 题</span><small>${questHits.length}</small></div>
        ${questHits.map(q => `
          <div class="quest-card">
            <div class="quest-title">${highlight(q.title, keyword)}</div>
            ${q.description ? `<div class="quest-desc">${highlight(q.description, keyword)}</div>` : ""}
            ${q.location ? `<div class="quest-reward">📍 ${highlight(q.location, keyword)}</div>` : ""}
          </div>
        `).join("")}
      </div>`;
    }

    if (!html) html = `<div class="panel"><div class="empty-hint">没 有 找 到 匹 配 的 内 容</div></div>`;

    results.innerHTML = html;
  } catch (e) {
    results.innerHTML = `<div class="panel"><div class="empty-hint">搜索失败：${esc(e.message)}</div></div>`;
  }
}

/* ==================== 教师端 ==================== */
let teacherTab = "quests";
let teacherQuestFilter = "unfinished";

function renderTeacherTabs() {
  document.getElementById("tabBar").innerHTML = `
    <div class="tab ${teacherTab==='quests'?'active':''}" onclick="switchTeacherTab('quests')">课 题 管 理</div>
    <div class="tab ${teacherTab==='review'?'active':''}" onclick="switchTeacherTab('review')">审 核 中 心</div>
    <div class="tab ${teacherTab==='students'?'active':''}" onclick="switchTeacherTab('students')">学 生 总 览</div>
    <div class="tab ${teacherTab==='teachers'?'active':''}" onclick="switchTeacherTab('teachers')">教 师 总 览</div>
    <div class="tab ${teacherTab==='forum'?'active':''}" onclick="switchTeacherTab('forum')">帖 子 管 理</div>
    <div class="tab ${teacherTab==='search'?'active':''}" onclick="switchTeacherTab('search')">搜 索</div>
  `;
  renderTeacherContent();
}
function switchTeacherTab(t) { teacherTab = t; renderTeacherTabs(); }

async function renderTeacherContent() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    if (teacherTab === "quests") await renderTeacherQuests();
    else if (teacherTab === "review") await renderReview();
    else if (teacherTab === "students") await renderStudents();
    else if (teacherTab === "teachers") await renderTeachers();
    else if (teacherTab === "forum") await renderForumAdmin();
    else if (teacherTab === "search") await renderSearch();
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function renderTeacherQuests() {
  const quests = await api(`quests?select=*&order=created_at.desc`);
  const all = Array.isArray(quests) ? quests : [];
  const unfinished = all.filter(q => q.status !== "done");
  const finished = all.filter(q => q.status === "done");
  const list = teacherQuestFilter === "unfinished" ? unfinished : finished;

  const box = document.getElementById("tabContents");
  box.innerHTML = `
    <button class="magic-btn big" onclick="openPublish()">＋ 发 布 新 课 题</button>

    <div class="tabs" style="margin-bottom:20px;">
      <div class="tab ${teacherQuestFilter==='unfinished'?'active':''}" onclick="setQuestFilter('unfinished')">未 完 成（${unfinished.length}）</div>
      <div class="tab ${teacherQuestFilter==='finished'?'active':''}" onclick="setQuestFilter('finished')">已 完 成（${finished.length}）</div>
    </div>

    <div class="panel">
      ${list.length ? list.map(q => {
        const overdue = isQuestOverdue(q);
        return `
        <div class="quest-card">
          <div class="quest-title">${esc(q.title)}</div>
          ${q.description ? `<div class="quest-desc">${esc(q.description)}</div>` : ""}
          ${q.location ? `<div class="quest-reward">📍 ${esc(q.location)}</div>` : ""}
          ${q.completion ? `<div class="quest-desc">✓ 完成条件：${esc(q.completion)}</div>` : ""}
          ${q.reward ? `<div class="quest-reward">✦ ${esc(q.reward)}</div>` : ""}
          ${q.max_claims ? `<div class="quest-reward">👥 已接：${q.claimed_count || 0} / ${q.max_claims}</div>` : ""}
          ${q.deadline_days ? `<div class="quest-reward">${deadlineText(q)}</div>` : ""}
          <span class="status-badge ${statusClass(q.status)}">${statusText(q.status)}</span>
          ${overdue ? `<span class="status-badge s-overdue">已超时</span>` : ""}
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
            <button class="magic-btn small" onclick="openEditQuest(${q.id})">编 辑</button>
            <button class="magic-btn small" onclick="openClaimList(${q.id}, '${esc(q.title)}')">查 看 接 取 者</button>
            <button class="magic-btn small danger" onclick="deleteQuest(${q.id})">删 除</button>
          </div>
        </div>
      `}).join("") : `<div class="empty-hint">暂 无 课 题</div>`}
    </div>
  `;
}

function setQuestFilter(f) {
  teacherQuestFilter = f;
  renderTeacherContent();
}

function openPublish() {
  const sel = document.getElementById("nqLocation");
  if (sel && sel.options.length <= 1) {
    LOCATIONS.forEach(l => {
      const opt = document.createElement("option");
      opt.value = l;
      opt.textContent = l;
      sel.appendChild(opt);
    });
  }
  ["nqTitle","nqDesc","nqCompletion","nqReward"].forEach(id => {
    const el = document.getElementById(id);
    if (el) el.value = "";
  });
  document.getElementById("nqLocation").value = "";
  document.getElementById("nqMax").value = 1;
  document.getElementById("nqDeadline").value = 7;
  document.getElementById("publishOverlay").classList.add("show");
}

function closePublish() {
  document.getElementById("publishOverlay").classList.remove("show");
}

async function createQuest() {
  const title = document.getElementById("nqTitle").value.trim();
  const desc = document.getElementById("nqDesc").value.trim();
  const location = document.getElementById("nqLocation").value;
  const completion = document.getElementById("nqCompletion").value.trim();
  const reward = document.getElementById("nqReward").value.trim();
  const max = parseInt(document.getElementById("nqMax").value) || 1;
  const deadline = parseInt(document.getElementById("nqDeadline").value) || 7;

  if (!title) { alert("请填标题"); return; }
  if (!desc) { alert("课题描述是必填的"); return; }
  if (!location) { alert("请选择任务地点"); return; }
  if (!completion) { alert("完成条件是必填的"); return; }
  if (max < 1) { alert("推荐接取人数至少为 1"); return; }

  showLoading("正 在 发 布");
  try {
    await api(`quests`, {
      method: "POST",
      body: JSON.stringify({
        title, description: desc, location, completion, reward,
        max_claims: max, deadline_days: deadline,
        claimed_count: 0, status: "open"
      })
    });
    setTimeout(() => {
      hideLoading();
      closePublish();
      renderTeacherContent();
    }, 700);
  } catch (e) {
    hideLoading();
    alert("失败：" + e.message);
  }
}

async function deleteQuest(id) {
  if (!confirm("确定删除这个课题？")) return;
  await api(`claims?quest_id=eq.${id}`, { method: "DELETE" });
  await api(`quests?id=eq.${id}`, { method: "DELETE" });
  renderTeacherContent();
}

async function openClaimList(questId, questTitle) {
  showLoading("正 在 读 取");
  try {
    const claims = await api(`claims?quest_id=eq.${questId}&select=*&order=created_at.asc`);
    hideLoading();
    const list = Array.isArray(claims) ? claims : [];

    if (!list.length) {
      openModal(`
        <div class="modal-title">接 取 者</div>
        <div style="font-size:13px;color:#c0b0d8;margin-bottom:16px;text-align:center;">${esc(questTitle)}</div>
        <div class="empty-hint" style="padding:20px;">暂 无 学 生 接 取</div>
        <div class="modal-actions">
          <button class="magic-btn small" style="flex:1" onclick="closeModal()">关 闭</button>
        </div>
      `);
      return;
    }

    openModal(`
      <div class="modal-title">接 取 者</div>
      <div style="font-size:13px;color:#c0b0d8;margin-bottom:16px;text-align:center;">${esc(questTitle)}</div>
      ${list.map(c => `
        <div class="quest-card" style="padding:12px 14px;">
          <div class="quest-title" style="font-size:15px;">${esc(c.student_name)}</div>
          <div class="quest-desc" style="font-size:13px;">学院：${esc(c.house || "—")}</div>
          <div class="quest-desc" style="font-size:13px;">
            状态：<span class="status-badge ${statusClass(c.status)}">${statusText(c.status)}</span>
          </div>
          ${c.items ? `<div class="quest-desc" style="font-size:13px;">物品：${esc(c.items)}</div>` : ""}
          <div style="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;">
            <button class="magic-btn small danger" style="padding:4px 12px;font-size:12px;" onclick="revokeClaim(${c.id}, ${questId}, '${esc(c.student_name)}')">撤 销 接 取</button>
            ${session.role === "super" && c.status === "completed" ? `<button class="magic-btn small" style="padding:4px 12px;font-size:12px;" onclick="revokeComplete(${c.id})">撤 销 完 成</button>` : ""}
          </div>
        </div>
      `).join("")}
      <div class="modal-actions">
        <button class="magic-btn small" style="flex:1" onclick="closeModal()">关 闭</button>
      </div>
    `);
  } catch (e) {
    hideLoading();
    alert("读取失败：" + e.message);
  }
}

async function revokeClaim(claimId, questId, studentName) {
  if (!confirm(`确定撤销「${studentName}」的接取？\n\nTA 将不再拥有这个课题。`)) return;
  showLoading("正 在 撤 销");
  try {
    await api(`claims?id=eq.${claimId}`, { method: "DELETE" });

    const q = await api(`quests?id=eq.${questId}&select=*`);
    if (q && q.length) {
      const newCount = Math.max(0, (q[0].claimed_count || 1) - 1);
      const patch = { claimed_count: newCount };
      if (q[0].status !== "done") {
        if (newCount < (q[0].max_claims || 1)) patch.status = "open";
        else patch.status = "taken";
      }
      await api(`quests?id=eq.${questId}`, { method: "PATCH", body: JSON.stringify(patch) });
    }

    hideLoading();
    closeModal();
    alert("已撤销");
    renderTeacherContent();
  } catch (e) {
    hideLoading();
    alert("撤销失败：" + e.message);
  }
}

async function openEditQuest(questId) {
  const q = await api(`quests?id=eq.${questId}&select=*`);
  if (!q || !q.length) { alert("课题不存在"); return; }
  const quest = q[0];
  const locationOptions = LOCATIONS.map(l =>
    `<option value="${l}" ${quest.location === l ? "selected" : ""}>${l}</option>`
  ).join("");
  const deadlineOptions = [1,3,7].map(d =>
    `<option value="${d}" ${quest.deadline_days === d ? "selected" : ""}>${d} 天</option>`
  ).join("");
  openModal(`
    <div class="modal-title">编 辑 课 题</div>
    <input type="text" id="eqTitle" class="magic-input" value="${esc(quest.title)}">
    <textarea id="eqDesc" class="magic-input" rows="4">${esc(quest.description || "")}</textarea>
    <div class="select-wrap">
      <select id="eqLocation" class="magic-select">
        <option value="">— 请选择任务地点 —</option>
        ${locationOptions}
      </select>
    </div>
    <textarea id="eqCompletion" class="magic-input" rows="3">${esc(quest.completion || "")}</textarea>
    <input type="text" id="eqReward" class="magic-input" value="${esc(quest.reward || "")}" placeholder="奖励">
    <input type="number" id="eqMax" class="magic-input" value="${quest.max_claims || 1}" min="1" placeholder="推荐接取人数">
    <div class="select-wrap">
      <select id="eqDeadline" class="magic-select">
        ${deadlineOptions}
      </select>
    </div>
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="saveEditQuest(${questId})">保 存</button>
    </div>
  `);
}

async function saveEditQuest(questId) {
  const title = document.getElementById("eqTitle").value.trim();
  const desc = document.getElementById("eqDesc").value.trim();
  const location = document.getElementById("eqLocation").value;
  const completion = document.getElementById("eqCompletion").value.trim();
  const reward = document.getElementById("eqReward").value.trim();
  const max = parseInt(document.getElementById("eqMax").value) || 1;
  const deadline = parseInt(document.getElementById("eqDeadline").value) || 7;
  if (!title || !desc || !location || !completion) {
    alert("标题、描述、地点、完成条件都不能为空");
    return;
  }
  showLoading("正 在 保 存");
  try {
    await api(`quests?id=eq.${questId}`, {
      method: "PATCH",
      body: JSON.stringify({
        title, description: desc, location, completion, reward,
        max_claims: max, deadline_days: deadline
      })
    });
    setTimeout(() => { hideLoading(); closeModal(); renderTeacherContent(); }, 600);
  } catch (e) {
    hideLoading();
    alert("保存失败：" + e.message);
  }
}

async function renderReview() {
  const claims = await api(`claims?select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);
  const box = document.getElementById("tabContents");
  const list = Array.isArray(claims) ? claims : [];
  const pendingClaim = list.filter(c => c.status === "pending");
  const pendingItems = list.filter(c => c.items_status === "pending");
  const doing = list.filter(c => c.status === "doing" || c.status === "approved");

  box.innerHTML = `
    <div class="panel">
      <div class="login-title" style="font-size:18px;margin-bottom:22px;">课 题 领 取 审 核</div>
      ${pendingClaim.length ? pendingClaim.map(c => `
        <div class="quest-card">
          <div class="quest-title">${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
          <div class="quest-desc">领取人：${esc(c.student_name)} · ${esc(c.house || "")}</div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="magic-btn small success" onclick="approveClaim(${c.id}, ${c.quest_id})">通 过</button>
            <button class="magic-btn small danger" onclick="rejectClaim(${c.id}, ${c.quest_id})">驳 回</button>
          </div>
        </div>
      `).join("") : `<div class="empty-hint">暂 无 待 审 核 的 领 取</div>`}
    </div>
    <div class="panel">
      <div class="login-title" style="font-size:18px;margin-bottom:22px;">物 品 审 核</div>
      ${pendingItems.length ? pendingItems.map(c => `
        <div class="quest-card">
          <div class="quest-title">${esc(c.items)}</div>
          <div class="quest-desc">提交人：${esc(c.student_name)} · ${esc(c.house || "")}</div>
          <div class="quest-desc">来源课题：${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
          <div style="display:flex;gap:8px;margin-top:12px;">
            <button class="magic-btn small success" onclick="approveItems(${c.id})">通 过</button>
            <button class="magic-btn small danger" onclick="rejectItems(${c.id})">驳 回</button>
            ${session.role === "super" ? `<button class="magic-btn small" onclick="editItems(${c.id}, '${esc(c.items)}')">修 改</button>` : ""}
          </div>
        </div>
      `).join("") : `<div class="empty-hint">暂 无 待 审 核 的 物 品</div>`}
    </div>
    <div class="panel">
      <div class="login-title" style="font-size:18px;margin-bottom:22px;">进 行 中 的 课 题</div>
      ${doing.length ? doing.map(c => `
        <div class="quest-card">
          <div class="quest-title">${esc((questMap[c.quest_id] || {}).title || "（已删除）")}</div>
          <div class="quest-desc">领取人：${esc(c.student_name)} · ${esc(c.house || "")}</div>
          ${c.items ? `<div class="quest-desc">已提交物品：${esc(c.items)}</div>` : ""}
          <div style="display:flex;gap:8px;margin-top:12px;flex-wrap:wrap;">
            <button class="magic-btn small success" onclick="markComplete(${c.id})">标 记 完 成</button>
            ${session.role === "super" ? `<button class="magic-btn small danger" onclick="revokeComplete(${c.id})">撤 销 完 成</button>` : ""}
          </div>
        </div>
      `).join("") : `<div class="empty-hint">暂 无 进 行 中 的 课 题</div>`}
    </div>
  `;
}

async function approveClaim(claimId, questId) {
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ status: "doing" }) });
  await api(`quests?id=eq.${questId}`, { method: "PATCH", body: JSON.stringify({ status: "doing" }) });
  renderTeacherContent();
}
async function rejectClaim(claimId, questId) {
  await api(`claims?id=eq.${claimId}`, { method: "DELETE" });
  const q = await api(`quests?id=eq.${questId}&select=*`);
  if (q && q.length) {
    const newCount = Math.max(0, (q[0].claimed_count || 1) - 1);
    const patch = { claimed_count: newCount };
    if (q[0].status === "taken" && newCount < (q[0].max_claims || 1)) patch.status = "open";
    await api(`quests?id=eq.${questId}`, { method: "PATCH", body: JSON.stringify(patch) });
  }
  renderTeacherContent();
}
async function approveItems(claimId) {
  await api(`claims?id=eq.${claimId}`, {
    method: "PATCH",
    body: JSON.stringify({ items_status: "approved", status: "completed" })
  });
  await checkQuestComplete(claimId);
  renderTeacherContent();
}
async function rejectItems(claimId) {
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ items_status: "rejected" }) });
  renderTeacherContent();
}
async function markComplete(claimId) {
  if (!confirm("确定标记这个课题为已完成？")) return;
  await api(`claims?id=eq.${claimId}`, {
    method: "PATCH",
    body: JSON.stringify({ status: "completed" })
  });
  await checkQuestComplete(claimId);
  renderTeacherContent();
}
async function revokeComplete(claimId) {
  if (!confirm("确定撤销完成？学生会回到「进行中」状态。")) return;
  await api(`claims?id=eq.${claimId}`, {
    method: "PATCH",
    body: JSON.stringify({ status: "doing" })
  });
  renderTeacherContent();
}

async function checkQuestComplete(claimId) {
  const c = await api(`claims?id=eq.${claimId}&select=*`);
  if (!c || !c.length) return;
  const questId = c[0].quest_id;
  const allClaims = await api(`claims?quest_id=eq.${questId}&select=*`);
  if (!Array.isArray(allClaims) || !allClaims.length) return;
  const allDone = allClaims.every(x => x.status === "completed");
  if (allDone) {
    await api(`quests?id=eq.${questId}`, {
      method: "PATCH",
      body: JSON.stringify({ status: "done" })
    });
  }
}

function editItems(claimId, current) {
  openModal(`
    <div class="modal-title">修 改 物 品 记 录</div>
    <input type="text" id="editItemsVal" class="magic-input" value="${esc(current)}">
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="saveEditItems(${claimId})">保 存</button>
    </div>
  `);
}
async function saveEditItems(claimId) {
  const v = document.getElementById("editItemsVal").value;
  await api(`claims?id=eq.${claimId}`, { method: "PATCH", body: JSON.stringify({ items: v }) });
  closeModal();
  renderTeacherContent();
}

async function renderStudents() {
  const students = await api(`students?select=*&order=created_at.asc`);
  const claims = await api(`claims?select=*&order=created_at.desc`);
  const quests = await api(`quests?select=*`);
  const questMap = {};
  if (Array.isArray(quests)) quests.forEach(q => questMap[q.id] = q);
  const box = document.getElementById("tabContents");
  const stuList = (Array.isArray(students) ? students : []).filter(s => s.role === "student" || !s.role);
  const claimList = Array.isArray(claims) ? claims : [];
  const byHouse = {};
  HOUSES.forEach(h => byHouse[h] = []);
  stuList.forEach(s => {
    if (!byHouse[s.house]) byHouse[s.house] = [];
    byHouse[s.house].push(s);
  });
  let html = "";
  for (const h of HOUSES) {
    const list = byHouse[h] || [];
    if (!list.length) continue;
    html += `
      <div class="house-group">
        <div class="house-group-title">
          <span>${h}</span>
          <small>${list.length} 人</small>
        </div>
        ${list.map(s => {
          const myClaims = claimList.filter(c => c.student_name === s.name);
          const grade = gradeText(s.grade);
          const loc = s.location || "阿斐理恩";
          return `
            <div class="student-row">
              <div class="name">${esc(s.name)}${grade ? `<span class="grade">${grade}</span>` : ""}<span class="grade" style="border-color:rgba(232,198,106,0.5);color:#f0d090;">📍 ${esc(loc)}</span></div>
              <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;">
                ${s.id ? `<button class="magic-btn small" style="padding:4px 12px;font-size:12px;" onclick="openChangeHouse(${s.id}, '${esc(s.name)}', '${esc(s.house || "")}')">修 改 学 院</button>` : ""}
                ${s.id ? `<button class="magic-btn small" style="padding:4px 12px;font-size:12px;" onclick="openChangeGrade(${s.id}, '${esc(s.name)}', ${s.grade || 1})">修 改 年 级</button>` : ""}
                ${s.id && session.role === "super" ? `<button class="magic-btn small danger" style="padding:4px 12px;font-size:12px;" onclick="deleteStudent(${s.id}, '${esc(s.name)}')">删 除</button>` : ""}
              </div>
              ${myClaims.length ? myClaims.map(c => {
                const q = questMap[c.quest_id] || {};
                const itemTxt = c.items ? ` · 物品：${esc(c.items)} <span class="status-badge ${itemStatusClass(c.items_status || "none")}">${itemStatusText(c.items_status || "none")}</span>` : "";
                return `<div class="quest-info">◆ ${esc(q.title || "（已删除）")} — ${statusText(c.status)}${itemTxt}</div>`;
              }).join("") : `<div class="quest-info">暂无领取记录</div>`}
            </div>
          `;
        }).join("")}
      </div>
    `;
  }
  if (!html) html = `<div class="empty-hint">暂 无 学 生 记 录</div>`;
  box.innerHTML = `<div class="panel">${html}</div>`;
}

async function deleteStudent(studentId, name) {
  if (!confirm(`确定删除学生「${name}」？\n\n会同时删除 TA 的所有课题记录和消息。`)) return;
  showLoading("正 在 删 除");
  try {
    await api(`claims?student_name=eq.${encodeURIComponent(name)}`, { method: "DELETE" });
    await api(`messages?to_user=eq.${encodeURIComponent(name)}`, { method: "DELETE" });
    await api(`students?id=eq.${studentId}`, { method: "DELETE" });
    setTimeout(() => { hideLoading(); renderTeacherContent(); alert("已删除"); }, 500);
  } catch (e) {
    hideLoading();
    alert("删除失败：" + e.message);
  }
}

function openChangeHouse(studentId, name, currentHouse) {
  const options = HOUSES.map(h =>
    `<option value="${h}" ${currentHouse === h ? "selected" : ""}>${h}</option>`
  ).join("");
  openModal(`
    <div class="modal-title">修 改 学 院</div>
    <div style="font-size:14px;color:#c0b0d8;margin-bottom:16px;text-align:center;">学生：${esc(name)}</div>
    <div class="select-wrap">
      <select id="changeHouseSelect" class="magic-select">${options}</select>
    </div>
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="saveChangeHouse(${studentId})">保 存</button>
    </div>
  `);
}
async function saveChangeHouse(studentId) {
  const newHouse = document.getElementById("changeHouseSelect").value;
  showLoading("正 在 修 改");
  try {
    await api(`students?id=eq.${studentId}`, {
      method: "PATCH",
      body: JSON.stringify({ house: newHouse })
    });
    setTimeout(() => { hideLoading(); closeModal(); renderTeacherContent(); }, 500);
  } catch (e) {
    hideLoading();
    alert("修改失败：" + e.message);
  }
}

function openChangeGrade(studentId, name, currentGrade) {
  const options = [1,2,3,4,5,6,7].map(g =>
    `<option value="${g}" ${currentGrade === g ? "selected" : ""}>${g} 年级</option>`
  ).join("");
  openModal(`
    <div class="modal-title">修 改 年 级</div>
    <div style="font-size:14px;color:#c0b0d8;margin-bottom:16px;text-align:center;">学生：${esc(name)}</div>
    <div class="select-wrap">
      <select id="changeGradeSelect" class="magic-select">${options}</select>
    </div>
    <div class="modal-actions">
      <button class="magic-btn small" style="flex:1" onclick="closeModal()">取 消</button>
      <button class="magic-btn small" style="flex:1" onclick="saveChangeGrade(${studentId})">保 存</button>
    </div>
  `);
}
async function saveChangeGrade(studentId) {
  const newGrade = parseInt(document.getElementById("changeGradeSelect").value) || 1;
  showLoading("正 在 修 改");
  try {
    await api(`students?id=eq.${studentId}`, {
      method: "PATCH",
      body: JSON.stringify({ grade: newGrade })
    });
    setTimeout(() => { hideLoading(); closeModal(); renderTeacherContent(); }, 500);
  } catch (e) {
    hideLoading();
    alert("修改失败：" + e.message);
  }
}

async function renderTeachers() {
  const students = await api(`students?select=*&order=created_at.asc`);
  const box = document.getElementById("tabContents");
  const list = (Array.isArray(students) ? students : []).filter(s => s.role === "teacher" || s.role === "super");
  if (!list.length) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 教 师 记 录</div></div>`;
    return;
  }
  box.innerHTML = `
    <div class="panel">
      <div class="login-title" style="font-size:18px;margin-bottom:22px;">教 师 名 单</div>
      ${list.map(t => `
        <div class="student-row">
          <div class="name">${esc(t.name)}${t.role === "super" ? '<span class="grade" style="border-color:rgba(232,198,106,0.7);color:#f0d090;">SUPER</span>' : ""}</div>
          <div class="quest-info">${esc(t.position || "—")}</div>
          ${session.role === "super" && t.role !== "super" ? `<div style="margin-top:8px;"><button class="magic-btn small danger" style="padding:4px 12px;font-size:12px;" onclick="deleteTeacher(${t.id}, '${esc(t.name)}')">删 除</button></div>` : ""}
        </div>
      `).join("")}
    </div>
  `;
}

async function deleteTeacher(teacherId, name) {
  if (!confirm(`确定删除教师「${name}」？`)) return;
  showLoading("正 在 删 除");
  try {
    await api(`students?id=eq.${teacherId}`, { method: "DELETE" });
    setTimeout(() => { hideLoading(); renderTeacherContent(); alert("已删除"); }, 500);
  } catch (e) {
    hideLoading();
    alert("删除失败：" + e.message);
  }
}

async function renderForumAdmin() {
  const box = document.getElementById("tabContents");
  box.innerHTML = `<div class="panel"><div class="empty-hint">正 在 读 取 ...</div></div>`;
  try {
    const posts = await api(`posts?select=*&order=created_at.desc`);
    if (!Array.isArray(posts) || !posts.length) {
      box.innerHTML = `<div class="panel"><div class="empty-hint">暂 无 帖 子</div></div>`;
      return;
    }
    const pending = posts.filter(p => p.status === "pending");
    const approved = posts.filter(p => p.status === "approved");
    let html = `
      <div class="panel">
        <div class="login-title" style="font-size:18px;margin-bottom:22px;color:#f0d090;">⏳ 待 审 核 帖 子（${pending.length}）</div>
        ${pending.length ? pending.map(p => `
          <div class="quest-card">
            <div class="quest-title">${esc(p.title || "（无标题）")}</div>
            <div class="quest-desc">${esc(p.content)}</div>
            <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")}</div>
            <div style="display:flex;gap:8px;margin-top:12px;">
              <button class="magic-btn small success" onclick="approvePost(${p.id})">通 过</button>
              <button class="magic-btn small danger" onclick="rejectPost(${p.id}, '${esc(p.author)}', '${esc(p.title || "")}')">驳 回 并 通 知</button>
            </div>
          </div>
        `).join("") : `<div class="empty-hint">暂 无 待 审 核 帖 子</div>`}
      </div>
    `;
    html += `
      <div class="panel">
        <div class="login-title" style="font-size:18px;margin-bottom:22px;">已 通 过 帖 子（${approved.length}）</div>
        ${approved.length ? approved.map(p => `
          <div class="quest-card">
            <div class="quest-title">${esc(p.title || "（无标题）")}</div>
            <div class="quest-desc">${esc(p.content)}</div>
            <div class="quest-reward">${esc(p.author)}${p.house ? " · " + esc(p.house) : ""} · ${new Date(p.created_at).toLocaleString("zh-CN")} · ♡ ${p.likes || 0}</div>
            <div style="display:flex;gap:8px;margin-top:12px;">
              <button class="magic-btn small danger" onclick="rejectPost(${p.id}, '${esc(p.author)}', '${esc(p.title || "")}')">删 除 并 通 知</button>
            </div>
          </div>
        `).join("") : `<div class="empty-hint">暂 无 已 通 过 帖 子</div>`}
      </div>
    `;
    box.innerHTML = html;
  } catch (e) {
    box.innerHTML = `<div class="panel"><div class="empty-hint">读取失败：${esc(e.message)}</div></div>`;
  }
}

async function approvePost(postId) {
  await api(`posts?id=eq.${postId}`, { method: "PATCH", body: JSON.stringify({ status: "approved" }) });
  renderForumAdmin();
}
async function rejectPost(postId, author, title) {
  if (!confirm(`确定删除「${author}」的帖子？会给 TA 发一条通知。`)) return;
  const reason = prompt("请填写违禁原因（会发给学生）：", "涉嫌违禁内容");
  if (reason === null) return;
  try {
    await api(`messages`, {
      method: "POST",
      body: JSON.stringify({
        to_user: author,
        from_user: session.name,
        type: "post_rejected",
        content: `你发布的帖子「${title || "（无标题）"}」已被删除。原因：${reason || "涉嫌违禁内容"}`
      })
    });
    await api(`post_comments?post_id=eq.${postId}`, { method: "DELETE" });
    await api(`posts?id=eq.${postId}`, { method: "DELETE" });
    alert("已删除，并已通知作者。");
    renderForumAdmin();
  } catch (e) {
    alert("操作失败：" + e.message);
  }
}

window.addEventListener("keydown", (e) => {
  if (e.key === "Escape") {
    closeModal();
    closePublish();
  }
});
